      <td style="width:260px"><b>${esc(v[0].trim())}</b></td><td class="dim">${esc(v[2])}</td></tr>`).join("")}</tbody></table></div></details>`).join("")}

  <div class="panel"><header><h2>Settimana per settimana</h2><span class="note">ore e rTSS sono la somma delle sedute generate; la nota è tua</span></header>
  <div class="tw" style="max-height:70vh;overflow-y:auto"><table>
    <thead><tr><th>S</th><th>Dal</th><th>Segmento</th><th>Fase</th><th>Tipo</th>
      <th class="num">Ore</th><th class="num">Nuo</th><th class="num">Bici</th><th class="num">Cor</th>
      <th class="num">For</th><th class="num">rTSS</th>
      <th class="num">Ore reg.</th><th class="num">TSS reg.</th><th class="num">Ader.</th>
      <th style="min-width:340px">Che cosa succede</th><th style="min-width:180px">Note</th></tr></thead>
    <tbody>${wks.map(w=>{ const a = wa[w.w]||{min:0,tss:0}, ah = a.min/60;
      return `<tr data-w="${w.w}" class="${rowClass(w)}">
      <td class="mono">${w.w}</td><td class="mono dim" style="white-space:nowrap">${fmtD(w.from)}</td>
      <td>${esc(w.gradino || w.periodo)}${w.isRace?' <span class="pill crit">gara</span>':""}</td>
      <td>${esc(w.seg==="blocco"?w.fase:"—")}</td><td>${esc(w.tipo)}</td>
      <td class="num mono"><b>${n2(w.hours)}</b></td>
      <td class="num mono dim">${n2(w.h.n)}</td><td class="num mono dim">${n2(w.h.b)}</td>
      <td class="num mono dim">${n2(w.h.c)}</td><td class="num mono dim">${n2(w.h.f)}</td>
      <td class="num mono">${w.tssPlan}</td>
      <td class="num mono">${ah?n2(ah):'<span class="dim">—</span>'}</td>
      <td class="num mono">${a.tss?Math.round(a.tss):'<span class="dim">—</span>'}</td>
      <td class="num">${ah&&w.hours?`<span class="pill ${complianceClass(ah/w.hours)}">${pct(ah/w.hours)}</span>`:'<span class="dim">—</span>'}</td>
      <td class="dim" style="font-size:11.5px">${esc(w.focus)}</td>
      <td><input data-k="note" value="${esc(w.note)}" placeholder="—"></td></tr>`;}).join("")}
    <tr class="tot"><td colspan="5">Totale piano</td><td class="num mono">${n1(tot.h)}</td>
      <td class="num mono">${n1(tot.n)}</td><td class="num mono">${n1(tot.b)}</td><td class="num mono">${n1(tot.c)}</td>
      <td class="num mono">${n1(tot.f)}</td><td class="num mono">${tot.t}</td>
      <td class="num mono">${n1(actH)}</td><td class="num mono">${Math.round(actT)}</td>
      <td class="num"><span class="pill ${complianceClass(actH/tot.h)}">${pct(actH/tot.h)}</span></td>
      <td colspan="2"></td></tr>
    </tbody></table></div></div>`;
  $("#view").querySelectorAll("tbody tr[data-w] [data-k=note]").forEach(inp=>{
    inp.onchange = ()=>{ S.note[inp.closest("tr").dataset.w] = inp.value; PLAN_CACHE.key = null; persist("config"); };
  });
}
</script>
<script>
"use strict";
/* ---------------------------------------------------- CALENDARIO */
function vCal(){
  const p = piano();
  if (!p.weeks){ $("#view").innerHTML = bannerPiano() + vuoto("Il calendario si riempie quando il piano esiste."); return; }
  const wks = weeks(), wa = weekActuals(), N = NW();
  const tw = weekOfDate(todayISO()); if (tw && !calWeek) calWeek = tw;
  calWeek = Math.max(1, Math.min(N, calWeek||tw||1));
  const w = wks[calWeek-1], a = wa[calWeek] || {min:0,tss:0};
  const maxH = Math.max(...wks.map(x=>x.hours), 0.1);
  $("#tbA").innerHTML = `<button class="btn sm" id="prevW">‹</button>
    <button class="btn sm" id="todayW">oggi</button><button class="btn sm" id="nextW">›</button>`;
  $("#view").innerHTML = `
  <div class="wknav"><div class="wkstrip" id="strip">
    ${wks.map(x=>`<button data-w="${x.w}" title="S${x.w} · ${esc(x.periodo)} · ${n1(x.hours)} h"
      class="${x.w===calWeek?"on":""} ${x.tipo==="Scarico"?"rest":x.isRace?"race":x.tipo==="Taper"?"taper":""}">
      <span style="height:${Math.round(x.hours/maxH*100)}%"></span></button>`).join("")}
  </div></div>
  <div class="panel"><header>
    <h2>Settimana ${calWeek} · ${esc(w.gradino || w.periodo)}${w.seg==="blocco"?` · ${esc(w.fase)}`:""}</h2>
    <span class="note">${fmtFull(w.from)} – ${fmtFull(w.to)} · ${esc(w.tipo)}${w.isRace?" · gara domenica":""}</span>
    <span class="spacer"></span>
    <span class="pill mute">${n2(w.hours)} h pianificate · ${w.tssPlan} rTSS</span>
    ${a.min?`<span class="pill ${complianceClass(a.min/60/(w.hours||1))}">${n2(a.min/60)} h registrate${w.hours?` · ${pct(a.min/60/w.hours)}`:""}</span>`:""}
  </header><div class="body">
    <p style="margin:0 0 14px;color:var(--ink-2);font-size:12.5px;max-width:92ch">${esc(w.focus)}</p>
    ${w.hours?`<div class="split" style="margin-bottom:6px">
      ${["n","b","c","f"].map((k,i)=>{const v=w.h[k]/w.hours;
        return v>0?`<i style="width:${(v*100).toFixed(1)}%;background:${["var(--s1)","var(--s2)","var(--s3)","var(--s4)"][i]}"></i>`:""}).join("")}
    </div>
    <div class="legend" style="margin:0">${["Nuoto","Bici","Corsa","Forza"].map(k=>
      `<span class="k"><i style="background:${DCOL[k]}"></i>${k} ${n2(w.h[DKEY[k]])} h</span>`).join("")}</div>`:""}
  </div></div>
  <div class="days">${[0,1,2,3,4,5,6].map(dow=>{
    const d = dayPlan((calWeek-1)*7+dow);
    const isToday = d.date === todayISO(), isRace = w.isRace && dow===6;
    const logged = S.sessions.filter(s=>s.date===d.date);
    const lm = logged.reduce((s,x)=>s+(+x.min||0),0);
    return `<div class="day ${isToday?"today":""} ${isRace?"raceday":""}" data-idx="${d.idx}">
      <div class="dh"><b>${DAYS_S[dow]}</b><span class="dim" style="font-size:11px">${fmtD(d.date)}</span>
        <span class="dt">${isToday?"oggi":""}</span></div>
      ${isRace?`<div class="sess"><div class="top">${chip("Brick")}</div><div class="work"><b>GARA — ${esc(w.gradino)}</b></div></div>`:""}
      ${d.sess.length ? d.sess.map((s,k)=>`<div class="sess">
        <div class="top">${chip(s.disc)}<span class="mins"><input type="number" data-slot="${k}" min="0" step="5"
          value="${s.min}" style="width:56px;text-align:right;padding:1px 4px;font-size:11.5px"> ′</span></div>
        <div class="work">${esc(s.tipo)} — ${esc(s.work)}</div>
        <div class="tss">${s.tss} rTSS · ${DOM_LABEL[s.dom]||s.dom}${s.costo?` · ${s.costo}`:""} ${s.min>0?`· <a href="#" data-log="${k}" style="color:var(--accent)">registra</a>`:""}</div>
      </div>`).join("") : (isRace?"":`<div class="sess dim" style="font-size:11.5px">${w.seg==="blocco"?"riposo":"nessuna seduta prescritta"}</div>`)}
      <div class="dayfoot"><span class="tot">${hm(d.total)}</span>
        ${lm?`<span class="pill ${complianceClass(lm/(d.total||1))}">${hm(lm)} fatti</span>`:""}
        <label class="chk"><input type="checkbox" data-done ${d.done?"checked":""}> fatto</label></div>
    </div>`;}).join("")}</div>
  <div class="panel" style="margin-top:20px"><header><h2>Note della settimana</h2></header>
    <div class="body"><textarea id="wnote" rows="3" placeholder="Come è andata, cosa hai cambiato, come ti senti…">${esc(S.note[calWeek]||"")}</textarea></div></div>`;

  $("#strip").querySelectorAll("button").forEach(b=>b.onclick=()=>{ calWeek=+b.dataset.w; render(); });
  $("#prevW").onclick = ()=>{ calWeek = Math.max(1,calWeek-1); render(); };
  $("#nextW").onclick = ()=>{ calWeek = Math.min(N,calWeek+1); render(); };
  $("#todayW").onclick = ()=>{ calWeek = weekOfDate(todayISO()) || 1; render(); };
  $("#wnote").onchange = e=>{ S.note[calWeek] = e.target.value; PLAN_CACHE.key = null; persist("config"); };
  $("#view").querySelectorAll(".day").forEach(card=>{
    const idx = +card.dataset.idx;
    const ov = () => (S.cal[idx] = S.cal[idx] || {s:[], done:false, note:""});
    card.querySelectorAll("input[data-slot]").forEach(inp=>{
      inp.onchange = ()=>{ const o = ov(); o.s = o.s||[]; const k = +inp.dataset.slot;
        o.s[k] = {...(o.s[k]||{}), min:Math.max(0,+inp.value||0)}; persist("calendar"); render(); };
    });
    card.querySelector("input[data-done]").onchange = e=>{ ov().done = e.target.checked; persist("calendar"); };
    card.querySelectorAll("a[data-log]").forEach(a=>{ a.onclick = ev=>{ ev.preventDefault();
      const d = dayPlan(idx), s = d.sess[+a.dataset.log];
      S.sessions.push({id:uid(), date:d.date, disc:s.disc, tipo:s.tipo, min:s.min, rpe:5, feel:"Buona", note:s.work});
      persist("sessions"); view = "diario"; render(); window.scrollTo(0,0); }; });
  });
}

/* ---------------------------------------------------- DIARIO */
const SESS_COLS = [
  ["date","Data","date",118],["disc","Disciplina","sel",104],["tipo","Tipo sessione","sel",150],
  ["min","Min","num",48],["dist","Dist. km/m","num",64],["hrAvg","FC med","num",54],
  ["hrMax","FC max","num",54],["pw","W med","num",54],["np","NP","num",50],
  ["pace","Passo s","num",56],["rpe","RPE","num",44]
];
function vDiario(){
  const list = sortedSessions();
  const tot = list.reduce((s,x)=>s+(+x.min||0),0), tss = list.reduce((s,x)=>s+sessionTSS(x),0);
  $("#tbA").innerHTML = `<span class="pill mute">${list.length} sessioni · ${hm(tot)} · ${Math.round(tss)} TSS</span>
    <button class="btn pri" id="addS">+ Nuova sessione</button>`;
  $("#view").innerHTML = `
  <p class="hint">Il TSS si calcola da solo: <b>bici</b> da NP e FTP, <b>corsa</b> dal passo soglia, <b>nuoto</b> dal CSS.
  Per forza, camminata, tennis e sessioni senza dati usa l'RPE (ore × RPE² × 2 — 1 h a RPE 7 ≈ 98 TSS).
  Scrivi il passo in secondi: al km per la corsa, ogni 100 m per il nuoto. Puoi sempre sovrascrivere il TSS col dato del tuo orologio.</p>
  <div class="panel">${list.length ? `<div class="tw" style="max-height:74vh;overflow-y:auto"><table class="dense">
    <thead><tr>${SESS_COLS.map(c=>`<th class="${c[2]==="num"?"num":""}">${c[1]}</th>`).join("")}
      <th class="num">TSS</th><th>Sensaz.</th><th>Note</th><th></th></tr></thead>
    <tbody>${list.map(s=>{
      const auto = sessionTSS({...s, tssOverride:null});
      return `<tr data-id="${s.id}" ${s.fonte==="dispositivo"?'title="importata da intervals.icu"':""}>
      ${SESS_COLS.map(([k,,t,wd])=>{
        if (t==="date") return `<td><input type="date" data-k="${k}" value="${esc(s.date)}" style="width:${wd}px"></td>`;
        if (t==="sel"){ const L = k==="disc"?DISC:(TIPI.includes(s[k])||!s[k]?TIPI:[s[k],...TIPI]);
          return `<td><select data-k="${k}" style="width:${wd}px">${opts(L, s[k])}</select>${k==="disc"&&s.fonte==="dispositivo"?'<span class="dim" title="da intervals.icu"> ⟳</span>':""}</td>`; }
        return `<td class="num"><input type="number" data-k="${k}" value="${s[k]??""}" style="width:${wd}px"
          step="${k==="dist"?"0.1":"1"}"></td>`;}).join("")}
      <td class="num"><input type="number" data-k="tssOverride" value="${s.tssOverride ?? auto}"
        title="Calcolato: ${auto}. Sovrascrivi col dato del tuo orologio se ce l'hai."
        style="width:54px;font-weight:600"></td>
      <td><select data-k="feel" style="width:88px"><option value=""></option>${opts(FEEL,s.feel)}</select></td>
      <td><input data-k="note" value="${esc(s.note)}" style="min-width:150px"></td>
      <td><button class="btn sm danger" data-del="${s.id}" title="Elimina">✕</button></td></tr>`;}).join("")}
    </tbody></table></div>` : `<div class="empty">Nessuna sessione registrata.<br>
      Aggiungine una qui sopra, oppure aprila dal Calendario con «registra» sotto una seduta pianificata.</div>`}
  </div>`;
  $("#addS").onclick = ()=>{ S.sessions.push({id:uid(), date:todayISO(), disc:"Bici", tipo:"Aerobico base",
    min:60, rpe:5, feel:"Buona", note:""}); persist("sessions"); render(); };
  $("#view").querySelectorAll("tr[data-id]").forEach(tr=>{
    const s = S.sessions.find(x=>x.id===tr.dataset.id);
    tr.querySelectorAll("[data-k]").forEach(inp=>{ inp.onchange = ()=>{
      const k = inp.dataset.k, v = inp.value;
      s[k] = (inp.type==="number") ? (v===""?null:+v) : v;
      if (k==="tssOverride" && s.tssOverride === sessionTSS({...s, tssOverride:null})) s.tssOverride = null;
      persist("sessions"); render(); }; });
    tr.querySelector("[data-del]").onclick = ()=>{ S.sessions = S.sessions.filter(x=>x.id!==s.id);
      persist("sessions"); render(); };
  });
}

/* ---------------------------------------------------- CORPO */
function vCorpo(){
  const N = Math.max(1, NW()); calWeek = Math.max(1,Math.min(N,calWeek||weekOfDate(todayISO())||1));
  const w = weeks()[calWeek-1] || {from:startDate(), to:addDays(startDate(),6), periodo:"—"};
  const F = [["peso","Peso","kg",.1],["fcRip","FC riposo","bpm",1],["hrv","HRV","ms",1],
    ["sonno","Sonno","h",.5],["qSonno","Qualità sonno","1-5",1],["stress","Stress","1-5",1],
    ["fatica","Fatica","1-5",1],["motiv","Motivazione","1-5",1]];
  const rows = [0,1,2,3,4,5,6].map(k=>addDays(w.from,k));
  const has = Object.keys(S.body).length;
  const avg = key => { const v = Object.values(S.body).map(b=>+b[key]).filter(x=>x>0);
    return v.length ? v.reduce((a,b)=>a+b,0)/v.length : null; };
  $("#tbA").innerHTML = `<button class="btn sm" id="prevW">‹</button>
    <span class="pill mute">Settimana ${calWeek}</span><button class="btn sm" id="nextW">›</button>`;
  $("#view").innerHTML = `
  <p class="hint">Rilevazione al risveglio. Il singolo dato non dice quasi nulla: quello che conta è il trend su 7-10 giorni.
  FC a riposo in salita, HRV in calo e sonno scarso nello stesso periodo sono il segnale per togliere carico, non per aggiungerne
  (famiglia OV della dottrina).</p>
  ${has?`<div class="stats g4">${F.slice(0,4).map(([k,lab,u])=>{const a=avg(k);
    return `<div class="stat"><div class="lab">${lab} — media</div>
      <div class="val">${a?n1(a):"—"}<small> ${u}</small></div>
      <div class="sub">su ${Object.values(S.body).filter(b=>+b[k]>0).length} rilevazioni</div></div>`;}).join("")}</div>`:""}
  <div class="panel"><header><h2>Settimana ${calWeek} · ${esc(w.gradino || w.periodo)}</h2>
    <span class="note">${fmtFull(w.from)} – ${fmtFull(w.to)}</span></header>
  <div class="tw"><table><thead><tr><th>Giorno</th>
    ${F.map(f=>`<th class="num">${f[1]}<br><span style="font-weight:400;text-transform:none;letter-spacing:0">${f[2]}</span></th>`).join("")}
    <th style="min-width:260px">Note</th></tr></thead><tbody>
    ${rows.map((d,i)=>{ const b = S.body[d]||{};
      return `<tr data-d="${d}"><td><b>${DAYS_S[i]}</b> <span class="dim mono">${fmtD(d)}</span></td>
      ${F.map(([k,,,st])=>`<td class="num"><input type="number" step="${st}" data-k="${k}" value="${b[k]??""}" style="width:66px"></td>`).join("")}
      <td><input data-k="note" value="${esc(b.note||"")}"></td></tr>`;}).join("")}
  </tbody></table></div></div>`;
  $("#prevW").onclick = ()=>{ calWeek=Math.max(1,calWeek-1); render(); };
  $("#nextW").onclick = ()=>{ calWeek=Math.min(N,calWeek+1); render(); };
  $("#view").querySelectorAll("tr[data-d]").forEach(tr=>{
    const d = tr.dataset.d;
    tr.querySelectorAll("[data-k]").forEach(inp=>{ inp.onchange = ()=>{
      const b = S.body[d] = S.body[d] || {};
      const v = inp.value; b[inp.dataset.k] = inp.type==="number" ? (v===""?null:+v) : v;
      persist("body"); }; });
  });
}

/* ---------------------------------------------------- TEST */
function vTest(){
  const list = S.tests.slice().sort((a,b)=>a.date<b.date?1:-1);
  const TT = ["FTP bici — test 20'","FTP bici — rampa","Soglia corsa — test 30'","CSS nuoto — 400/200 m",
    "VO2max","Peso e composizione","FC massima","Altro"];
  $("#tbA").innerHTML = `<button class="btn pri" id="addT">+ Nuovo test</button>`;
  $("#view").innerHTML = `
  <p class="hint">Ogni volta che rifai un test, registralo qui e poi aggiorna il valore corrispondente nel Setup:
  zone e TSS si riallineano subito (S1–S6: le soglie si misurano, non si stimano a lungo).</p>
  <div class="panel">${list.length?`<div class="tw"><table><thead><tr><th>Data</th><th>Test</th>
    <th class="num">Risultato</th><th>Unità</th><th class="num">FC media</th><th class="num">FC max</th>
    <th style="min-width:300px">Note e condizioni</th><th></th></tr></thead><tbody>
    ${list.map(t=>`<tr data-id="${t.id}">
      <td><input type="date" data-k="date" value="${esc(t.date)}" style="width:130px"></td>
      <td><select data-k="tipo" style="width:210px">${opts(TT,t.tipo)}</select></td>
      <td class="num"><input type="number" step="0.1" data-k="val" value="${t.val??""}" style="width:80px"></td>
      <td><input data-k="unit" value="${esc(t.unit||"")}" style="width:70px"></td>
      <td class="num"><input type="number" data-k="hrAvg" value="${t.hrAvg??""}" style="width:66px"></td>
      <td class="num"><input type="number" data-k="hrMax" value="${t.hrMax??""}" style="width:66px"></td>
      <td><input data-k="note" value="${esc(t.note||"")}"></td>
      <td><button class="btn sm danger" data-del title="Elimina">✕</button></td></tr>`).join("")}
  </tbody></table></div>`:`<div class="empty">Nessun test registrato.</div>`}</div>`;
  $("#addT").onclick = ()=>{ S.tests.push({id:uid(), date:todayISO(), tipo:"FTP bici — test 20'",
    val:null, unit:"W", note:""}); persist("tests"); render(); };
  $("#view").querySelectorAll("tr[data-id]").forEach(tr=>{
    const t = S.tests.find(x=>x.id===tr.dataset.id);
    tr.querySelectorAll("[data-k]").forEach(inp=>{ inp.onchange = ()=>{ const v = inp.value;
      t[inp.dataset.k] = inp.type==="number" ? (v===""?null:+v) : v; persist("tests"); }; });
    tr.querySelector("[data-del]").onclick = ()=>{ S.tests = S.tests.filter(x=>x.id!==t.id);
      persist("tests"); render(); };
  });
}
</script>
<script>
"use strict";
const RAMP = ["#b7d3f6","#9ec5f4","#6da7ec","#3987e5","#256abf","#184f95","#0d366b"];
/* ---------------------------------------------------- ZONE */
function vZone(){
  const st = S.setup;
  const table = (title, sub, head, rows) => `
    <div class="panel"><header><h2>${title}</h2><span class="note">${sub}</span></header>
    <div class="tw"><table><thead><tr><th style="width:52px">Zona</th><th>Nome</th>
      ${head.map(h=>`<th class="num">${h}</th>`).join("")}<th style="min-width:280px">Uso</th>
      <th style="width:90px">% soglia</th></tr></thead><tbody>${rows}</tbody></table></div></div>`;
  const zrow = (i,z,name,cells,use,pctTxt) => `<tr>
    <td><span class="dc"><i style="background:${RAMP[i]};border-radius:2px"></i><b>${z}</b></span></td>
    <td>${name}</td>${cells.map(c=>`<td class="num mono">${c}</td>`).join("")}
    <td class="dim">${use}</td><td class="dim mono" style="font-size:11px">${pctTxt}</td></tr>`;
  $("#view").innerHTML = `
  <p class="hint">Tutte le zone derivano dalle soglie che hai inserito nel Setup — FTP ${st.ftp} W,
  passo soglia ${mmss(st.thrPace)}/km, CSS ${mmss(st.css)}/100 m, FC soglia ${st.lthrBike} (bici) e ${st.lthrRun} (corsa).
  Cambia una soglia lì e queste tabelle si riscrivono. Modello: potenza Coggan, FC e passo Friel, nuoto CSS.</p>
  ${table("Bici — potenza","in watt, sulla base dell'FTP",["Da","A"],
    ZONES.bikePw.map(([z,n,lo,hi,use],i)=>zrow(i,z,n,[Math.round(st.ftp*lo),Math.round(st.ftp*hi)],use,
      `${Math.round(lo*100)}–${Math.round(hi*100)}% FTP`)).join(""))}
  ${table("Bici — frequenza cardiaca","in bpm, sulla base della FC soglia in bici",["Da","A"],
    ZONES.hr.map(([z,n,lo,hi],i)=>zrow(i,z,n,[Math.round(st.lthrBike*lo),Math.round(st.lthrBike*hi)],
      "bpm", `${Math.round(lo*100)}–${Math.round(hi*100)}% LTHR`)).join(""))}
  ${table("Corsa — passo","min/km, sulla base del passo soglia",["Più lento","Più veloce"],
    ZONES.runPace.map(([z,n,lo,hi,use],i)=>zrow(i,z,n,[mmss(st.thrPace*hi),mmss(st.thrPace*lo)],use,
      `${Math.round(lo*100)}–${Math.round(hi*100)}% del passo`)).join(""))}
  ${table("Corsa — frequenza cardiaca","in bpm, sulla base della FC soglia in corsa",["Da","A"],
    ZONES.hrRun.map(([z,n,lo,hi],i)=>zrow(i,z,n,[Math.round(st.lthrRun*lo),Math.round(st.lthrRun*hi)],
      "bpm", `${Math.round(lo*100)}–${Math.round(hi*100)}% LTHR`)).join(""))}
  ${table("Nuoto — passo","min/100 m, sulla base del CSS",["Più lento","Più veloce"],
    ZONES.swim.map(([z,n,lo,hi],i)=>zrow(i,z,n,[mmss(st.css+hi),mmss(st.css+lo)],
      z==="Z4"?"Passo CSS. Ritmo gara Ironman ≈ CSS +4/+8″":"", `CSS ${lo>0?"+":""}${lo}″ / ${hi>0?"+":""}${hi}″`)).join(""))}`;
}

/* ---------------------------------------------------- SETUP */
function vSetup(){
  const st = S.setup, p = piano();
  const f = (k,lab,unit,step,extra) => `<label class="fld">${lab} <span class="u">${unit||""}</span>
    <input data-s="${k}" type="number" step="${step||1}" value="${st[k]}">${extra?`<span class="u">${extra}</span>`:""}</label>`;
  $("#tbA").innerHTML = `<button class="btn danger" id="reset">Ripristina i valori di partenza</button>`;
  const account = inClaude() ? "" : `
  <div class="panel"><header><h2>Account</h2>
    <span class="note">${SB.attivo() ? `connesso come ${esc(SB.email())}: diario, test, recupero e piano sono nel database` : "senza accesso i dati restano in questo browser"}</span>
    <span class="spacer"></span>${SB.attivo() ? `<button class="btn sm" id="sbOut">Esci</button>` : ""}</header>
    ${SB.attivo() ? "" : `<div class="body grid g4">
      <label class="fld">Email<input id="sbEmail" type="email" autocomplete="username" placeholder="tu@esempio.it"></label>
      <label class="fld">Password<input id="sbPw" type="password" autocomplete="current-password" placeholder="almeno 6 caratteri"></label>
      <div class="fld" style="justify-content:flex-end;flex-direction:row;gap:8px;align-items:flex-end">
        <button class="btn pri" id="sbIn">Accedi</button><button class="btn" id="sbUp">Registrati</button></div>
      <div class="fld" style="justify-content:flex-end"><span class="u" id="sbMsg" style="color:${SB.errore()?"var(--crit)":"inherit"}">${esc(SB.errore() || "")}</span></div>
    </div>`}
  </div>`;
  const iv = SB.attivo() ? SB.intervals() : null;
  const intervalsPanel = (inClaude() || !SB.attivo()) ? "" : `
  <div class="panel"><header><h2>intervals.icu</h2>
    <span class="note">${iv ? `collegato (atleta ${esc(iv.athlete_id)}) · ultimo import ${iv.ultimo_import ? esc(fmtFull(iv.ultimo_import.slice(0,10)) + " " + iv.ultimo_import.slice(11,16)) : "mai"}${iv.ultimo_esito ? " · " + esc(iv.ultimo_esito) : ""}` : "le attività registrate dall'orologio arrivano nel diario da sole (fonte: dispositivo)"}</span>
    <span class="spacer"></span>${iv ? `<button class="btn sm pri" id="ivImport" ${SB.importInCorso()?"disabled":""}>Importa ora</button>` : ""}</header>
    <div class="body grid g4">
      <label class="fld">Athlete ID <span class="u">lascia 0 per l'atleta della chiave</span><input id="ivId" value="${esc(iv ? iv.athlete_id : "0")}"></label>
      <label class="fld">Chiave API <span class="u">intervals.icu → Settings → Developer</span><input id="ivKey" type="password" placeholder="${iv ? "già salvata — scrivi solo per cambiarla" : "incolla la chiave"}"></label>
      <div class="fld" style="justify-content:flex-end;flex-direction:row;gap:8px;align-items:flex-end"><button class="btn" id="ivSave">${iv ? "Aggiorna" : "Collega"}</button></div>
      <div class="fld" style="justify-content:flex-end"><span class="u" id="ivMsg"></span></div>
    </div></div>`;
  $("#view").innerHTML = bannerPiano() + account + intervalsPanel + `
  <p class="hint">Sei numeri decidono il piano: quale gradino hai già fatto, quante settimane mancano alla gara (dalla data),
  quante ore puoi dedicare e se sono un tetto rigido, quante ne fai oggi. Il motore applica la dottrina e dice
  fin dove si arriva. Le soglie tarano zone e TSS del diario.</p>

  <div class="panel"><header><h2>Atleta e obiettivo</h2>
    <span class="spacer"></span>${p.scala?`<span class="pill ${p.scala.raggiunge_obiettivo?"ok":"warn"}">arrivo: ${esc(p.scala.arrivo)} · ${esc(p.scala.vincolo)}</span>`:""}</header>
    <div class="body grid g4">
    <label class="fld">Nome<input data-s="atleta" type="text" value="${esc(st.atleta)}"></label>
    <label class="fld">Data della gara <span class="u">settimana ${settimaneAllaGara()} dal lunedì ${fmtFull(startDate())}</span>
      <input data-s="raceDate" type="date" value="${esc(st.raceDate)}"></label>
    <label class="fld">Gradino già completato<select data-s="gradinoFatto"><option value="" ${st.gradinoFatto?"":"selected"}>nessuno — da zero</option>${opts(GRADINI, st.gradinoFatto)}</select></label>
    <label class="fld">Obiettivo<select data-s="obiettivo">${opts(GRADINI, st.obiettivo)}</select></label>
    ${f("oreDisponibili","Ore settimanali disponibili","h",.5)}
    <label class="fld">Le ore sono un tetto rigido? <span class="u">se no, sono un fabbisogno che può crescere</span>
      <span><input data-s="tettoRigido" type="checkbox" ${st.tettoRigido?"checked":""}> tetto rigido (A3)</span></label>
    ${f("oreOggi","Ore settimanali oggi","h",.5)}
    ${f("ctl0","CTL iniziale","fitness di partenza",1)}
  </div></div>

  <div class="panel"><header><h2>Soglie</h2><span class="note">aggiornale dopo ogni test</span></header>
    <div class="body grid g4">
    ${f("ftp","FTP bici","W",1)}
    ${f("lthrBike","FC soglia bici","bpm",1)}
    ${f("thrPace","Passo soglia corsa","secondi al km",1,mmss(st.thrPace)+" /km")}
    ${f("lthrRun","FC soglia corsa","bpm",1)}
    ${f("css","CSS nuoto","secondi ogni 100 m",1,mmss(st.css)+" /100 m")}
    ${f("hrMax","FC massima","bpm",1)}
    ${f("hrRest","FC a riposo","bpm",1)}
    ${f("peso","Peso","kg",.1,n2(st.ftp/st.peso)+" W/kg alla soglia")}
  </div></div>

  <div class="panel"><header><h2>Librerie</h2><span class="note">dati, non regole — dal database Supabase «Triathlon Engine»</span>
    <span class="spacer"></span><button class="btn sm" id="reloadLib2" ${(mcpRef||!inClaude())?"":"disabled"}>Ricarica da Supabase</button></header>
    <div class="body" style="font-size:12.5px;color:var(--ink-2)">
      Stato: <b>${esc(libStato)}</b>${libErrore?` — ${esc(libErrore)}`:""}.
      ${LIB.varianti?` ${LIB.varianti.length} varianti e ${LIB.workouts.length} workout di forza, caricati il ${esc((LIB.loadedAt||"").slice(0,16).replace("T"," "))} (${esc(LIB.fonte||"cache")}).`:""}
      ${(mcpRef||!inClaude())?"":" Il connettore Supabase non è disponibile in questa vista: le librerie restano quelle in cache del browser."}
    </div></div>

  <div class="panel"><header><h2>Come si calcola il TSS</h2></header><div class="body">
    <div class="grid g2" style="font-size:12.5px;color:var(--ink-2)">
      <div><b style="color:var(--ink)">Con i dati</b>
        <ul style="margin:6px 0 0;padding-left:18px;line-height:1.7">
        <li>Bici — ore × (NP / FTP)² × 100</li>
        <li>Corsa — ore × (passo soglia / passo medio)² × 100</li>
        <li>Nuoto — ore × (CSS / passo medio 100 m)² × 100</li></ul></div>
      <div><b style="color:var(--ink)">Senza dati</b>
        <p style="margin:6px 0 0;line-height:1.6">Forza, camminata, tennis e ogni sessione senza potenza o passo:
        <b>ore × RPE² × 2</b>. Un'ora a RPE 7 vale circa 98 TSS. Il piano, invece, usa il rTSS della libreria.</p></div>
    </div></div></div>`;

  $("#view").querySelectorAll("[data-s]").forEach(inp=>{ inp.onchange = ()=>{
    const k = inp.dataset.s;
    st[k] = inp.type==="number" ? (+inp.value||0) : inp.type==="checkbox" ? inp.checked : inp.value;
    persist("config"); render(); }; });
  const rl = $("#reloadLib2"); if (rl) rl.onclick = async()=>{ await caricaLibrerie(true); render(); };
  const sbMsg = (t, err) => { const m = $("#sbMsg"); if (m){ m.textContent = t; m.style.color = err ? "var(--crit)" : "inherit"; } };
  const sbGo = async (fn) => { const email = ($("#sbEmail").value||"").trim(), pw = $("#sbPw").value||"";
    if (!email || pw.length < 6) return sbMsg("servono email e una password di almeno 6 caratteri", true);
    sbMsg("un momento…"); try{ const r = await fn(email, pw); if (r) sbMsg(r); if (!SB.attivo()) return; render(); }catch(e){ sbMsg(e.message, true); } };
  if ($("#sbIn")) $("#sbIn").onclick = () => sbGo(SB.login);
  if ($("#sbUp")) $("#sbUp").onclick = () => sbGo(SB.registra);
  if ($("#sbPw")) $("#sbPw").onkeydown = e => { if (e.key === "Enter") sbGo(SB.login); };
  if ($("#sbOut")) $("#sbOut").onclick = async () => { await SB.logout(); render(); };
  const ivMsg = (t, err) => { const m = $("#ivMsg"); if (m){ m.textContent = t; m.style.color = err ? "var(--crit)" : "inherit"; } };
  if ($("#ivSave")) $("#ivSave").onclick = async () => { ivMsg("salvo…"); try{ await SB.salvaIntervals($("#ivId").value, $("#ivKey").value); render(); }catch(e){ ivMsg(e.message, true); } };
  if ($("#ivImport")) $("#ivImport").onclick = async () => { ivMsg("importo da intervals.icu…"); $("#ivImport").disabled = true;
    try{ const j = await SB.importaIntervals({oldest: addDays(todayISO(), -90)}); render(); }catch(e){ ivMsg(e.message, true); $("#ivImport").disabled = false; } };
  $("#reset").onclick = ()=>{ S.setup = {...SETUP0}; S.note = {}; S.cal = {}; persist("config"); persist("calendar"); render(); };
}
boot();
</script>
