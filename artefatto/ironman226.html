<title>Ironman 226</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Chivo:wght@300;400;500;600;700;900&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<style>
:root{
  --bg:#F1F3F7; --surface:#FFFFFF; --surface-2:#F7F9FC; --surface-3:#EDF1F6;
  --line:#DBE1EA; --line-2:#C2CBD8;
  --ink:#111826; --ink-2:#4B586C; --ink-3:#7D8899;
  --accent:#1E4E8C; --accent-2:#2F6DB0; --accent-soft:#E6EEF9; --on-accent:#FFFFFF;
  --ok:#12775A; --warn:#A96D07; --crit:#AE372C;
  --ok-soft:#E3F2EC; --warn-soft:#FBF0DC; --crit-soft:#FAE7E4;
  --s1:#2a78d6; --s2:#eb6834; --s3:#1baf7a; --s4:#eda100; --s5:#e87ba4;
  --plan:#AAB4C4; --plan-soft:#DFE4EC;
  --grid:#E7EBF1; --shadow:0 1px 2px rgba(17,24,38,.06),0 8px 24px -14px rgba(17,24,38,.22);
  --radius:10px;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0A101A; --surface:#121B27; --surface-2:#16202D; --surface-3:#1C2735;
  --line:#243040; --line-2:#374759;
  --ink:#E8EDF4; --ink-2:#A5B0C0; --ink-3:#75808F;
  --accent:#6FA6E8; --accent-2:#8FBCF0; --accent-soft:#16283E; --on-accent:#08111C;
  --ok:#4CBF97; --warn:#DDA23C; --crit:#E8776A;
  --ok-soft:#122A24; --warn-soft:#2C2313; --crit-soft:#2E1B18;
  --s1:#3987e5; --s2:#d95926; --s3:#199e70; --s4:#c98500; --s5:#d55181;
  --plan:#5A6879; --plan-soft:#243040;
  --grid:#1E2937; --shadow:0 1px 2px rgba(0,0,0,.4),0 10px 26px -16px rgba(0,0,0,.7);
  color-scheme:dark;
}}
:root[data-theme="dark"]{
  --bg:#0A101A; --surface:#121B27; --surface-2:#16202D; --surface-3:#1C2735;
  --line:#243040; --line-2:#374759;
  --ink:#E8EDF4; --ink-2:#A5B0C0; --ink-3:#75808F;
  --accent:#6FA6E8; --accent-2:#8FBCF0; --accent-soft:#16283E; --on-accent:#08111C;
  --ok:#4CBF97; --warn:#DDA23C; --crit:#E8776A;
  --ok-soft:#122A24; --warn-soft:#2C2313; --crit-soft:#2E1B18;
  --s1:#3987e5; --s2:#d95926; --s3:#199e70; --s4:#c98500; --s5:#d55181;
  --plan:#5A6879; --plan-soft:#243040;
  --grid:#1E2937; --shadow:0 1px 2px rgba(0,0,0,.4),0 10px 26px -16px rgba(0,0,0,.7);
  color-scheme:dark;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);
  font-family:"Chivo","Helvetica Neue",Arial,sans-serif;font-size:13.5px;line-height:1.45;
  -webkit-font-smoothing:antialiased}
.mono,input[type="number"],td.num,th.num{font-family:"IBM Plex Mono",ui-monospace,Menlo,monospace;font-variant-numeric:tabular-nums}
h1,h2,h3,h4{margin:0;font-weight:700;letter-spacing:-.01em;text-wrap:balance}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:4px}

/* ---------- shell ---------- */
.app{display:grid;grid-template-columns:236px 1fr;min-height:100vh}
.rail{background:var(--surface);border-right:1px solid var(--line);display:flex;flex-direction:column;
  position:sticky;top:0;height:100vh;overflow:hidden}
.brand{padding:20px 20px 16px;border-bottom:1px solid var(--line)}
.brand .eyebrow{font-size:10px;letter-spacing:.22em;text-transform:uppercase;color:var(--ink-3);font-weight:600}
.brand .mark{font-weight:900;font-size:38px;line-height:.9;letter-spacing:-.045em;margin-top:2px;
  font-family:"Chivo",sans-serif}
.brand .sub{font-size:11px;color:var(--ink-3);margin-top:6px;letter-spacing:.01em}
.nav{padding:10px 10px;overflow-y:auto;flex:1}
.nav-group{font-size:9.5px;letter-spacing:.18em;text-transform:uppercase;color:var(--ink-3);
  font-weight:600;padding:14px 10px 6px}
.nav button{display:flex;align-items:center;gap:9px;width:100%;text-align:left;background:none;border:0;
  padding:7px 10px;border-radius:7px;cursor:pointer;color:var(--ink-2);font-size:13px;font-weight:500}
.nav button:hover{background:var(--surface-3);color:var(--ink)}
.nav button.on{background:var(--accent-soft);color:var(--accent);font-weight:600}
.nav button .ico{width:15px;flex:none;opacity:.85}
.nav button .badge{margin-left:auto;font-size:10.5px;color:var(--ink-3);font-family:"IBM Plex Mono",monospace}
.railfoot{border-top:1px solid var(--line);padding:12px 16px 14px;display:flex;flex-direction:column;gap:9px}
.countdown{display:flex;align-items:baseline;gap:7px}
.countdown b{font-family:"IBM Plex Mono",monospace;font-size:26px;font-weight:600;letter-spacing:-.03em}
.countdown span{font-size:10.5px;color:var(--ink-3);text-transform:uppercase;letter-spacing:.1em}
.savedot{display:flex;align-items:center;gap:6px;font-size:10.5px;color:var(--ink-3)}
.savedot i{width:6px;height:6px;border-radius:50%;background:var(--ok);display:block}
.savedot.pending i{background:var(--warn)}
.savedot.off i{background:var(--ink-3)}

.main{min-width:0;display:flex;flex-direction:column}
.topbar{position:sticky;top:0;z-index:30;background:color-mix(in srgb,var(--bg) 88%,transparent);
  backdrop-filter:blur(8px);border-bottom:1px solid var(--line);
  padding:14px 26px;display:flex;align-items:center;gap:16px}
.topbar h1{font-size:19px;font-weight:700}
.topbar .kicker{font-size:10px;letter-spacing:.18em;text-transform:uppercase;color:var(--ink-3);font-weight:600}
.topbar .spacer{flex:1}
.view{padding:22px 26px 60px;max-width:1500px}
.hint{color:var(--ink-2);font-size:12.5px;max-width:78ch;margin:0 0 18px}

/* ---------- controls ---------- */
.btn{background:var(--surface);border:1px solid var(--line-2);border-radius:7px;padding:6px 12px;
  cursor:pointer;font-size:12.5px;font-weight:500;color:var(--ink-2)}
.btn:hover{border-color:var(--ink-3);color:var(--ink)}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--on-accent);font-weight:600}
.btn.pri:hover{background:var(--accent-2);border-color:var(--accent-2)}
.btn.ghost{border-color:transparent;background:transparent}
.btn.sm{padding:3px 8px;font-size:11.5px}
.btn.danger:hover{color:var(--crit);border-color:var(--crit)}
input,select,textarea{font:inherit;background:var(--surface);color:var(--ink);border:1px solid var(--line-2);
  border-radius:6px;padding:5px 8px;width:100%;min-width:0}
input:focus,select:focus,textarea:focus{border-color:var(--accent);outline:none;
  box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 16%,transparent)}
input[type="number"]{text-align:right}
input[type="checkbox"]{width:auto;accent-color:var(--accent)}
label.fld{display:flex;flex-direction:column;gap:4px;font-size:11.5px;color:var(--ink-2);font-weight:500}
label.fld .u{color:var(--ink-3);font-weight:400}

/* ---------- surfaces ---------- */
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);
  box-shadow:var(--shadow);margin-bottom:20px;overflow:hidden}
.panel > header{padding:13px 18px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:12px}
.panel > header h2{font-size:13px;font-weight:700;letter-spacing:.02em}
.panel > header .note{font-size:11.5px;color:var(--ink-3);font-weight:400}
.panel > header .spacer{flex:1}
.panel .body{padding:18px}
.grid{display:grid;gap:14px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.g5{grid-template-columns:repeat(5,minmax(0,1fr))}
@media(max-width:1150px){.g4,.g5{grid-template-columns:repeat(2,minmax(0,1fr))}.g3{grid-template-columns:repeat(2,minmax(0,1fr))}}

/* ---------- stats ---------- */
.stats{display:grid;gap:1px;background:var(--line);border:1px solid var(--line);border-radius:var(--radius);
  overflow:hidden;margin-bottom:20px}
.stat{background:var(--surface);padding:14px 16px}
.stat .lab{font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-3);font-weight:600}
.stat .val{font-family:"IBM Plex Mono",monospace;font-size:27px;font-weight:500;letter-spacing:-.035em;
  margin-top:5px;line-height:1}
.stat .val small{font-size:13px;color:var(--ink-3);font-weight:400;letter-spacing:0}
.stat .sub{font-size:11px;color:var(--ink-3);margin-top:5px}
.pill{display:inline-flex;align-items:center;gap:5px;font-size:10.5px;font-weight:600;padding:2px 7px;
  border-radius:100px;letter-spacing:.02em}
.pill.ok{background:var(--ok-soft);color:var(--ok)}
.pill.warn{background:var(--warn-soft);color:var(--warn)}
.pill.crit{background:var(--crit-soft);color:var(--crit)}
.pill.mute{background:var(--surface-3);color:var(--ink-3)}

/* ---------- tables ---------- */
.tw{overflow-x:auto}
table{border-collapse:separate;border-spacing:0;width:100%;font-size:12.5px}
th{font-size:9.5px;letter-spacing:.11em;text-transform:uppercase;color:var(--ink-3);font-weight:600;
  text-align:left;padding:8px 9px;background:var(--surface-2);position:sticky;top:0;z-index:2;
  border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:5px 9px;border-bottom:1px solid var(--grid);vertical-align:middle}
th.num,td.num{text-align:right}
tr.alt td{background:var(--surface-2)}
tbody tr:hover td{background:var(--surface-3)}
td input,td select{border-color:transparent;background:transparent;padding:3px 5px}
td input:hover,td select:hover{border-color:var(--line-2)}
td input:focus,td select:focus{background:var(--surface)}
.wk-load td:first-child{box-shadow:inset 3px 0 0 var(--accent)}
.wk-rest td:first-child{box-shadow:inset 3px 0 0 var(--s4)}
.wk-race td:first-child{box-shadow:inset 3px 0 0 var(--crit)}
.wk-taper td:first-child{box-shadow:inset 3px 0 0 var(--s5)}
.dim{color:var(--ink-3)}
table.dense td,table.dense th{padding:3px 6px}
.dayfoot .tot,.dayfoot .pill,.dayfoot .chk{white-space:nowrap}
.wkstrip button{height:34px}
.tot td{font-weight:700;background:var(--surface-3);border-top:2px solid var(--line-2)}

/* ---------- discipline chips ---------- */
.dc{display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.dc i{width:8px;height:8px;border-radius:2px;display:block;flex:none}
.d-Nuoto{background:var(--s1)} .d-Bici{background:var(--s2)} .d-Corsa{background:var(--s3)}
.d-Forza{background:var(--s4)} .d-Bodyweight{background:var(--s4)} .d-Altro{background:var(--s5)}
.d-Brick{background:var(--s5)} .d-Riposo{background:var(--line-2)}

/* ---------- calendar ---------- */
.wknav{display:flex;align-items:center;gap:10px;margin-bottom:16px;flex-wrap:wrap}
.wkstrip{display:flex;gap:2px;flex:1;min-width:300px}
.wkstrip button{flex:1;height:30px;border:0;border-radius:3px;background:var(--surface-3);cursor:pointer;
  position:relative;padding:0;min-width:0}
.wkstrip button span{position:absolute;inset:auto 0 0 0;background:var(--accent);border-radius:0 0 3px 3px}
.wkstrip button.on{outline:2px solid var(--ink);outline-offset:1px}
.wkstrip button.rest span{background:var(--s4)} .wkstrip button.race span{background:var(--crit)}
.wkstrip button.taper span{background:var(--s5)}
.days{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:10px}
@media(max-width:1250px){.days{grid-template-columns:repeat(4,minmax(0,1fr))}}
.day{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);overflow:hidden;
  display:flex;flex-direction:column;min-height:210px}
.day.today{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent-soft)}
.day.raceday{border-color:var(--crit);box-shadow:0 0 0 2px var(--crit-soft)}
.day > .dh{padding:8px 10px;border-bottom:1px solid var(--line);display:flex;align-items:baseline;gap:6px;
  background:var(--surface-2)}
.day > .dh b{font-size:12px}
.day > .dh .dt{font-family:"IBM Plex Mono",monospace;font-size:11px;color:var(--ink-3);margin-left:auto}
.sess{padding:9px 10px;border-bottom:1px dashed var(--grid);display:flex;flex-direction:column;gap:3px}
.sess:last-of-type{border-bottom:0}
.sess .top{display:flex;align-items:center;gap:6px}
.sess .top .mins{margin-left:auto;font-family:"IBM Plex Mono",monospace;font-size:11.5px;font-weight:600}
.sess .work{font-size:11.5px;color:var(--ink-2);line-height:1.35}
.sess .tss{font-size:10px;color:var(--ink-3);font-family:"IBM Plex Mono",monospace}
.dayfoot{margin-top:auto;padding:7px 10px;border-top:1px solid var(--line);display:flex;align-items:center;
  gap:8px;background:var(--surface-2);font-size:11px}
.dayfoot .tot{font-family:"IBM Plex Mono",monospace;font-weight:600;background:none;border:0}
.chk{display:flex;align-items:center;gap:5px;color:var(--ink-3);cursor:pointer;margin-left:auto}

/* ---------- charts ---------- */
.chart{width:100%;display:block;overflow:visible;fill:var(--ink-3)}
.chart text{font-family:"IBM Plex Mono",monospace;font-size:9.5px}
.chart .axline{stroke:var(--grid);stroke-width:1}
.chart .zeroline{stroke:var(--line-2);stroke-width:1}
.legend{display:flex;flex-wrap:wrap;gap:14px;margin:2px 0 12px;font-size:11.5px;color:var(--ink-2)}
.legend .k{display:inline-flex;align-items:center;gap:6px}
.legend .k i{width:11px;height:11px;border-radius:3px;display:block}
.legend .k.line i{height:3px;border-radius:2px;width:16px}
.tip{position:fixed;z-index:200;pointer-events:none;background:var(--surface);border:1px solid var(--line-2);
  border-radius:7px;box-shadow:var(--shadow);padding:8px 10px;font-size:11.5px;min-width:130px;opacity:0;
  transition:opacity .1s}
.tip.on{opacity:1}
.tip b{display:block;font-size:11px;margin-bottom:4px;color:var(--ink)}
.tip .r{display:flex;gap:10px;justify-content:space-between;color:var(--ink-2)}
.tip .r span:last-child{font-family:"IBM Plex Mono",monospace;color:var(--ink);font-weight:500}

.empty{padding:34px 18px;text-align:center;color:var(--ink-3);font-size:12.5px}
.demo-bar{display:flex;align-items:center;gap:10px;background:var(--warn-soft);color:var(--warn);
  border:1px solid color-mix(in srgb,var(--warn) 32%,transparent);border-radius:8px;padding:8px 12px;
  font-size:12px;margin-bottom:16px;font-weight:500}
.demo-bar .spacer{flex:1}
.zonebar{height:9px;border-radius:3px;display:block}
.split{display:flex;gap:3px;align-items:center;height:9px}
.split i{display:block;height:9px;border-radius:2px}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>

<script>
"use strict";
/* =====================================================================
   IRONMAN 226 — il piano generato dal motore (engine.js, porting TS di
   scala_gen.py + generatore.py). Le regole stanno nel Manuale del piano di
   allenamento, scheda "La dottrina"; qui c'è solo l'interfaccia.
   Setup → Scala → Calendario → Diario → Zone → Test → Recupero → Forma → Dashboard
   ===================================================================== */
const E = window.TriathlonEngine;
const SUPABASE_PROJECT = "yzuyikzrtobjuijngjmc";   // progetto "Triathlon Engine" (eu-central-1)
const SUPABASE_SERVER = "Supabase";                  // nome del connettore in claude.ai

const DAYS = ["Lunedì","Martedì","Mercoledì","Giovedì","Venerdì","Sabato","Domenica"];
const DAYS_S = ["Lun","Mar","Mer","Gio","Ven","Sab","Dom"];
const MONTHS = ["gen","feb","mar","apr","mag","giu","lug","ago","set","ott","nov","dic"];
const DISC = ["Nuoto","Bici","Corsa","Forza","Bodyweight","Brick","Altro","Riposo"];
const DKEY = {Nuoto:"n",Bici:"b",Corsa:"c",Forza:"f",Altro:"a"};
/* disciplina del motore -> disciplina dell'interfaccia e del diario */
const DISC_UI = {"Nuoto":"Nuoto","Ciclismo":"Bici","Corsa a piedi":"Corsa","Forza":"Forza"};
const TIPI = ["Recupero attivo","Aerobico base","Aerobico lento (lungo)","Ritmo gara specifico","Soglia anaerobica",
  "VO2max","Preparazione atletica","Brick","Tecnica","Acque libere","Camminata","Tennis / sport vario","Test","Gara","Altro"];
const FEEL = ["Ottima","Buona","Normale","Scarsa","Pessima"];
const GRADINI = ["Triathlon Sprint","Triathlon Olimpico","Half-Ironman","Ironman"];
const FASI_LABEL = ["Preparation","Base 1","Base 2","Build 1","Build 2","Specific","Peak","Taper"];
const DOM_LABEL = {LOW:"basso", MOD:"medio", HIGH:"alto"};

/* ===================== date utilities ===================== */
const DAY_MS = 86400000;
const iso = d => d.toISOString().slice(0,10);
const parseISO = s => { const [y,m,d] = s.split("-").map(Number); return new Date(Date.UTC(y,m-1,d)); };
const addDays = (s,n) => iso(new Date(parseISO(s).getTime()+n*DAY_MS));
const diffDays = (a,b) => Math.round((parseISO(b)-parseISO(a))/DAY_MS);
const todayISO = () => { const t = new Date(); return iso(new Date(Date.UTC(t.getFullYear(),t.getMonth(),t.getDate()))); };
/* lunedì della settimana che contiene la data */
const mondayOf = s => addDays(s, -((parseISO(s).getUTCDay()+6)%7));
function fmtD(s,long){ const d = parseISO(s);
  return d.getUTCDate()+" "+MONTHS[d.getUTCMonth()]+(long?" "+d.getUTCFullYear():""); }
function fmtFull(s){ const d = parseISO(s);
  return String(d.getUTCDate()).padStart(2,"0")+"/"+String(d.getUTCMonth()+1).padStart(2,"0")+"/"+d.getUTCFullYear(); }
const mmss = sec => { if(!(sec>0)) return "—"; const m = Math.floor(sec/60), s = Math.round(sec%60);
  return m+":"+String(s).padStart(2,"0"); };
const hm = min => { const h = Math.floor(min/60), m = Math.round(min%60);
  return h ? h+"h "+String(m).padStart(2,"0")+"'" : m+"'"; };
const n1 = v => (Math.round(v*10)/10).toFixed(1);
const n2 = v => (Math.round(v*100)/100).toFixed(2);
const pct = v => isFinite(v) ? Math.round(v*100)+"%" : "—";
const nf = v => Math.round(v).toLocaleString("it-IT");
const uid = () => (crypto.randomUUID ? crypto.randomUUID() : "xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx".replace(/[xy]/g, c => { const r = Math.random()*16|0; return (c==="x"?r:(r&3|8)).toString(16); }));

/* ===================== state ===================== */
const SETUP0 = {
  atleta:"Vittorio", raceDate:"2027-04-11",
  gradinoFatto:"", obiettivo:"Ironman", oreDisponibili:11, tettoRigido:false, oreOggi:5,
  ctl0:30, ftp:220, lthrBike:160, thrPace:285, lthrRun:168, css:100, hrMax:185, hrRest:48, peso:75
};
const SETUP_KEYS = Object.keys(SETUP0);
let S = { setup:{...SETUP0}, note:{}, cal:{}, sessions:[], tests:[], body:{} };
let LIB = { varianti:null, workouts:null, loadedAt:null, fonte:"" };   // librerie dal database
let view = "dashboard", calWeek = 0, dbRef = null, mcpRef = null, libStato = "non caricate", libErrore = "";

/* ===================== librerie (Supabase via connettore) ===================== */
const LIB_LS = "ironman226.lib.v1";
function parseSupabase(payload){
  // execute_sql risponde con un testo che racchiude il JSON fra tag <untrusted-data-…>
  if (payload && typeof payload === "object") return payload;
  const t = String(payload || "");
  const m = t.match(/<untrusted-data-[^>]*>\s*([\s\S]*?)\s*<\/untrusted-data-[^>]*>/);
  const body = m ? m[1] : t;
  return JSON.parse(body);
}
async function sql(query){
  const r = await mcpRef.callTool(SUPABASE_SERVER, "execute_sql", {project_id:SUPABASE_PROJECT, query},
    {cache:{staleTime:300000}});
  return parseSupabase(r.payload);
}
/* Fuori da claude.ai (pagina statica) le librerie si leggono via REST con la chiave
   pubblica: le quattro tabelle hanno RLS con sola lettura pubblica. Dentro claude.ai
   gli host esterni sono bloccati e si passa dal connettore (mcp). */

/* ===================== il piano ===================== */
let PLAN_CACHE = {key:null, val:null};
/* il piano parte dal lunedì di questa settimana e finisce nella settimana della gara */
const startDate = () => mondayOf(addDays(todayISO(), 1));   // di domenica il piano parte dal lunedì dopo
function settimaneAllaGara(){ return Math.floor(diffDays(startDate(), mondayOf(S.setup.raceDate))/7) + 1; }
function piano(){
  const st = S.setup;
  const key = JSON.stringify([st.gradinoFatto, st.obiettivo, st.oreDisponibili, st.tettoRigido, st.oreOggi,
    settimaneAllaGara(), LIB.loadedAt]);
  if (PLAN_CACHE.key === key) return PLAN_CACHE.val;
  let val;
  const n = settimaneAllaGara();
  if (!LIB.varianti) val = {errore:"librerie non caricate"};
  else if (n < 1) val = {errore:"la data della gara è passata"};
  else {
    const r = E.generaPiano({gradino_fatto: st.gradinoFatto || null, settimane:n, ore_disponibili:+st.oreDisponibili,
      ore_oggi:+st.oreOggi, obiettivo:st.obiettivo, tetto_rigido:!!st.tettoRigido}, LIB.varianti, LIB.workouts);
    val = r.errore ? r : costruisciCalendario(r);
  }
  PLAN_CACHE = {key, val}; return val;
}
/* Dispone i segmenti della scala sul calendario. ASSUNZIONE (da confermare nella
   dottrina): il blocco più alto finisce nella settimana della gara; a ritroso vengono
   le transizioni, i blocchi inferiori e l'introduzione; le settimane che la scala non
   assorbe stanno all'inizio, "fra due stagioni", fuori dal generatore. */
function costruisciCalendario(r){
  const sc = r.scala, segs = [];
  const push = (seg, n, extra) => { for (let k=0;k<n;k++) segs.push({seg, k, n, ...extra}); };
  push("attesa", sc.non_assorbite, {label:"Fra due stagioni"});
  push("intro", sc.intro, {label:"Introduzione"});
  r.blocchi.forEach((b, bi) => {
    if (bi > 0) push("transizione", E.TRANSIZIONE, {label:"Transizione", dopo:r.blocchi[bi-1].A.gara});
    b.W.forEach(wk => segs.push({seg:"blocco", bi, b, wk, label:wk.fase, gradino:b.A.gara,
      isRace: wk.w === b.A.settimane}));
  });
  const weeks = segs.map((s,i) => {
    const w = i+1, from = addDays(startDate(), i*7), to = addDays(startDate(), i*7+6);
    const sed = s.seg==="blocco" ? s.b.PIANO.filter(p => p.w === s.wk.w) : [];
    const h = {n:0,b:0,c:0,f:0,a:0}; let tss = 0;
    for (const p of sed){ h[DKEY[DISC_UI[p.disc]]] += p.tempo/60; tss += p.rtss; }
    const hours = h.n+h.b+h.c+h.f+h.a;
    const tipo = s.seg==="blocco" ? s.wk.tipo : s.seg==="attesa" ? "Fuori dottrina" : s.seg==="intro" ? "Introduzione" : "Transizione";
    const periodo = s.label;
    return { i, w, from, to, seg:s.seg, periodo, tipo, gradino:s.gradino||"", bi:s.bi, wb:s.wk?s.wk.w:null,
      fase:s.wk?s.wk.fase:"", pos:s.wk?s.wk.pos:0, isRace:!!s.isRace, sed, hours, h, tssPlan:Math.round(tss),
      focus: focusSettimana(s), note:S.note[w]||"" };
  });
  return { ...r, weeks, N:weeks.length };
}
function focusSettimana(s){
  if (s.seg==="attesa") return "Settimane che nessun blocco della scala può assorbire (E7): periodo fra due stagioni, fuori dal perimetro della dottrina. Mantenimento libero.";
  if (s.seg==="intro") return `Introduzione per chi parte da zero (${s.n} settimane, DEFAULT): costruire l'abitudine prima del primo blocco. Il generatore non prescrive sedute qui.`;
  if (s.seg==="transizione") return `Recupero dopo la gara ${s.dopo}: ${s.n} settimane di transizione senza sedute prescritte.`;
  const wk = s.wk, b = s.b;
  const forza = b.PIANO.filter(p => p.w===wk.w && p.disc==="Forza").length;
  const q = b.PIANO.filter(p => p.w===wk.w && p.dom!=="LOW" && p.disc!=="Forza").length;
  return `${s.gradino} · settimana ${wk.w} di ${b.A.settimane} · fase ${wk.fase} · ${wk.tipo}` +
    (wk.tipo==="Carico" ? ` (posizione ${wk.pos} del blocco di 4)` : "") +
    ` · ${forza} sedute di forza, ${q} sedute di qualità` + (s.isRace ? " · GARA domenica" : "");
}
const NW = () => { const p = piano(); return p.weeks ? p.N : 1; };
const ND = () => NW()*7;
const weeks = () => { const p = piano(); return p.weeks || []; };
function weekOfDate(dt){ const n = diffDays(startDate(), dt); return n<0||n>ND()-1 ? null : Math.floor(n/7)+1; }

/* --- una giornata del calendario: generata + override --- */
function dayPlan(idx){
  const wi = Math.floor(idx/7), dow = idx%7, wr = weeks()[wi], date = addDays(startDate(), idx);
  const sess = (wr ? wr.sed : []).filter(p => p.giorno === DAYS[dow]).map(p => ({
    disc: DISC_UI[p.disc], tipo: p.ob, work: p.struttura + (p.cod==="BRICK" ? "" : ` · ${p.cod}`),
    min: Math.round(p.tempo), tss: Math.round(p.rtss), dom: p.dom, costo: p.costo || "",
    rtss_min: p.tempo ? p.rtss/p.tempo : 0 }));
  const ov = S.cal[idx] || {};
  if (ov.s) ov.s.forEach((o,k)=>{ if(o && sess[k]) Object.assign(sess[k], o,
    {tss: o.min!=null ? Math.round(o.min*sess[k].rtss_min) : sess[k].tss}); });
  return { idx, date, dow, week:wi+1, wr, sess, done:!!ov.done, note:ov.note||"",
           total: sess.reduce((s,x)=>s+(x.min||0),0) };
}

/* --- TSS di una sessione registrata --- */
function sessionTSS(s){
  if (s.tssOverride != null && s.tssOverride !== "") return +s.tssOverride;
  const st = S.setup, hrs = (+s.min||0)/60;
  const fallback = () => Math.round(hrs * Math.pow(+s.rpe||0, 2) * 2);
  if (s.disc === "Bici"  && +s.np>0 && st.ftp>0)     return Math.round(hrs*Math.pow(s.np/st.ftp,2)*100);
  if (s.disc === "Corsa" && +s.pace>0 && st.thrPace>0) return Math.round(hrs*Math.pow(st.thrPace/s.pace,2)*100);
  if (s.disc === "Nuoto" && +s.pace>0 && st.css>0)   return Math.round(hrs*Math.pow(st.css/s.pace,2)*100);
  return fallback();
}
const sortedSessions = () => S.sessions.slice().sort((a,b)=> a.date<b.date?1:a.date>b.date?-1:0);
function weekActuals(){
  const map = {};
  for (const s of S.sessions){
    const w = weekOfDate(s.date); if (!w) continue;
    const m = map[w] || (map[w] = {min:0, tss:0, d:{}});
    m.min += +s.min||0; m.tss += sessionTSS(s);
    m.d[s.disc] = (m.d[s.disc]||0) + (+s.min||0);
  }
  return map;
}
function pmc(){
  const daily = {}, dailyMin = {};
  for (const s of S.sessions){ daily[s.date] = (daily[s.date]||0) + sessionTSS(s); dailyMin[s.date] = (dailyMin[s.date]||0) + (+s.min||0); }
  const out = []; let ctl = S.setup.ctl0, atl = S.setup.ctl0;
  for (let i=0;i<ND();i++){
    const date = addDays(startDate(), i), tss = daily[date]||0;
    const tsb = i===0 ? 0 : Math.round((ctl-atl)*10)/10;
    ctl = Math.round((ctl + (tss-ctl)/42)*10)/10;
    atl = Math.round((atl + (tss-atl)/7)*10)/10;
    out.push({i, date, week:Math.floor(i/7)+1, tss, min:dailyMin[date]||0, ctl, atl, tsb});
  }
  return out;
}
/* --- zone, calcolate dalle soglie --- */
const ZONES = {

    ["Z2","Fondo aerobico",.56,.75,"Il pane quotidiano dell'Ironman: lunghi e volume"],

    ["Z4","Soglia",.94,.99],["Z5a","Sopra-soglia",1.00,1.02],["Z5b","VO2max",1.03,1.06],
    ["Z5c","Anaerobico",1.07,1.15]],
  hrRun:[["Z1","Recupero",0,.84],["Z2","Fondo aerobico",.85,.89],["Z3","Medio",.90,.94],
    ["Z4","Soglia",.95,.99],["Z5a","Sopra-soglia",1.00,1.02],["Z5b","VO2max",1.03,1.06],
    ["Z5c","Anaerobico",1.07,1.15]],
  runPace:[["Z1","Recupero",1.30,1.60,"Rigenerante"],["Z2","Fondo aerobico",1.14,1.29,"Il ritmo dei lunghi"],
    ["Z3","Medio",1.06,1.13,"≈ ritmo maratona Ironman"],["Z4","Soglia",1.00,1.05,"Ritmo soglia"],
    ["Z5a","Sopra-soglia",.97,.99,""],["Z5b","VO2max",.90,.96,""],["Z5c","Anaerobico",.80,.89,""]],

<script>
"use strict";
/* ===================== persistenza ===================== */
const LS = "ironman226.v2";
const PARTS = { config:()=>({setup:S.setup, note:S.note}), calendar:()=>({cal:S.cal}),
                tests:()=>({tests:S.tests}), body:()=>({body:S.body}), sessions:()=>({sessions:S.sessions}) };
let saveTimer = null, pendingParts = new Set();
function setSave(mode,txt){ const d = document.getElementById("saveDot");
  d.className = "savedot "+mode; d.lastElementChild.textContent = txt; }
function persist(part){
  pendingParts.add(part);
  try{ localStorage.setItem(LS, JSON.stringify(S)); }catch(e){}
  if (typeof SB !== "undefined" && SB.attivo()){ SB.persist(part); return; }
  if (!dbRef){ setSave("", "salvato su questo browser"); return; }
  setSave("pending","salvataggio…");
  clearTimeout(saveTimer);
  saveTimer = setTimeout(async ()=>{
    const parts = [...pendingParts]; pendingParts.clear();
    try{
      await Promise.all(parts.map(p => dbRef.doc("plan/"+p).set(PARTS[p]())));
      setSave("", "sincronizzato");
    }catch(e){ setSave("off", e && e.code === "revoked" ? "sola lettura" : "salvato in locale"); }
  }, 700);
}
function mergeState(o){
  if (!o) return;
  if (o.setup){ for (const k of SETUP_KEYS) if (o.setup[k] !== undefined) S.setup[k] = o.setup[k]; }
  if (o.note && typeof o.note === "object") S.note = o.note;
  if (o.cal) S.cal = o.cal;
  if (Array.isArray(o.sessions)) S.sessions = o.sessions.filter(s => !s.demo);
  if (Array.isArray(o.tests)) S.tests = o.tests;
  if (o.body) S.body = o.body;
}
async function boot(){
  try{ const raw = localStorage.getItem(LS); if (raw) mergeState(JSON.parse(raw)); }catch(e){}
  await caricaLibrerie(false);
  render();
  const [db, mcp] = await Promise.all([
    (async()=>{ try{ return window.claude && claude.use ? await claude.use("db") : null; }catch(e){ return null; } })(),
    (async()=>{ try{ return window.claude && claude.use ? await claude.use("mcp") : null; }catch(e){ return null; } })()
  ]);
  mcpRef = mcp;
  if (!LIB.varianti){ await caricaLibrerie(true); render(); }
  if (!inClaude()){ await SB.avvia(); return; }   // pagina pubblica: i dati vivono su Supabase, con login
  if (!db){ setSave("", "salvato su questo browser"); return; }
  dbRef = db;
  try{
    const snaps = await Promise.all(Object.keys(PARTS).map(p => db.doc("plan/"+p).get()));
    let found = false;
    snaps.forEach(s => { if (s.exists){ found = true; mergeState(s.data()); } });
    if (found){ render(); setSave("", "sincronizzato"); }
    else { setSave("pending","primo salvataggio…"); Object.keys(PARTS).forEach(persist); }
  }catch(e){ setSave("off","salvato in locale"); }
}

const $ = s => document.querySelector(s);
const esc = s => String(s==null?"":s).replace(/[&<>"']/g, c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
function chip(d){ return `<span class="dc"><i class="d-${esc(d)}"></i>${esc(d)}</span>`; }
function opts(list, val){ return list.map(o=>`<option ${o===val?"selected":""}>${esc(o)}</option>`).join(""); }
function complianceClass(r){ if (!isFinite(r)) return "mute"; if (r>=.9 && r<=1.15) return "ok";
  if (r>=.7 && r<=1.3) return "warn"; return "crit"; }
const rowClass = w => w.tipo==="Scarico" ? "wk-rest" : w.isRace ? "wk-race" : w.tipo==="Taper" ? "wk-taper" : w.seg==="blocco" ? "wk-load" : "";
const verPill = v => `<span class="pill ${v[1]==="OK"?"ok":"crit"}" title="${esc(v[2])}">${esc(v[0].trim())}</span>`;

/* ===================== navigazione ===================== */
const VIEWS = [
  {id:"dashboard", t:"Dashboard", k:"Sintesi", g:"Sintesi"},
  {id:"forma",     t:"Forma",     k:"Sintesi", g:"Sintesi"},
  {id:"atp",       t:"Scala e piano", k:"Pianificazione", g:"Pianificazione"},
  {id:"calendario",t:"Calendario", k:"Pianificazione", g:"Pianificazione"},
  {id:"diario",    t:"Diario allenamenti", k:"Registrazione", g:"Registrazione"},
  {id:"corpo",     t:"Recupero", k:"Registrazione", g:"Registrazione"},
  {id:"test",      t:"Test", k:"Registrazione", g:"Registrazione"},
  {id:"zone",      t:"Zone", k:"Riferimenti", g:"Riferimenti"},
  {id:"setup",     t:"Setup", k:"Riferimenti", g:"Riferimenti"}
];
const ICON = { dashboard:"◧", forma:"∿", atp:"▤", calendario:"▦", diario:"✎", corpo:"♡", test:"⌾", zone:"≡", setup:"⚙" };
function renderNav(){
  const nSess = S.sessions.length;
  let html = "", lastG = null;
  for (const v of VIEWS){
    if (v.g !== lastG){ html += `<div class="nav-group">${v.g}</div>`; lastG = v.g; }
    let badge = "";
    if (v.id === "diario") badge = nSess ? String(nSess) : "";
    if (v.id === "calendario") { const w = weekOfDate(todayISO()); badge = w ? "S"+w : ""; }
    html += `<button data-v="${v.id}" class="${view===v.id?"on":""}"><span class="ico">${ICON[v.id]}</span>${esc(v.t)}${badge?`<span class="badge">${badge}</span>`:""}</button>`;
  }
  $("#nav").innerHTML = html;
  $("#nav").querySelectorAll("button").forEach(b => b.onclick = ()=>{ view = b.dataset.v; render(); window.scrollTo(0,0); });
  const dleft = diffDays(todayISO(), S.setup.raceDate);
  $("#cdN").textContent = dleft >= 0 ? dleft : "—";
  $("#cdL").textContent = dleft > 1 ? "giorni al via" : dleft === 1 ? "giorno al via" :
    dleft === 0 ? "è oggi. Buona gara." : "gara passata";
  const p = piano();
  $("#brandSub").textContent = p.scala ? `arrivo: ${p.scala.arrivo}` : "—";

function bannerPiano(){
  const p = piano();
  if (p.weeks) return "";
  const lib = !LIB.varianti ? `<b>Librerie:</b> ${esc(libStato)}${libErrore?` — ${esc(libErrore)}`:""}` : "";
  return `<div class="demo-bar"><span>Il piano non può essere generato: ${esc(p.errore||"")}. ${lib}</span>
    <span class="spacer"></span>${!LIB.varianti && (mcpRef||!inClaude())?`<button class="btn sm" id="reloadLib">Carica le librerie</button>`:""}</div>`;
}
function wireBanner(){ const b = document.getElementById("reloadLib"); if (b) b.onclick = async()=>{ await caricaLibrerie(true); render(); }; }
function render(){
  renderNav();
  const v = VIEWS.find(x=>x.id===view);
  $("#tbK").textContent = v.k; $("#tbT").textContent = v.t;
  $("#tbA").innerHTML = "";
  ({dashboard:vDashboard, forma:vForma, atp:vATP, calendario:vCal, diario:vDiario,
    corpo:vCorpo, test:vTest, zone:vZone, setup:vSetup})[view]();
  wireBanner();
}

<script>

/* ===================== Supabase: utente e dati dell'atleta =====================
   Vale per la pagina pubblica (fuori da claude.ai). L'atleta accede con email e
   password (Supabase Auth); i suoi dati stanno nelle tabelle del contratto C1–C8 e
   ogni tabella è leggibile e scrivibile solo da lui (policy RLS, migrazione 06).
   La pagina continua a tenere lo stato in S; questo strato lo carica dal database al
   login e lo sincronizza per differenza a ogni modifica. Senza login i dati restano

const SB = (() => {

  const GRADINO_DB = {"Triathlon Sprint":"Sprint","Triathlon Olimpico":"Olimpico","Half-Ironman":"Half","Ironman":"Ironman"};
  const DISC_DB = {Nuoto:"Nuoto", Bici:"Ciclismo", Corsa:"Corsa", Forza:"Forza", Bodyweight:"Forza", Brick:"Brick", Altro:"Altro", Riposo:"Altro"};
  const DISC_DA_DB = {Nuoto:"Nuoto", Ciclismo:"Bici", Corsa:"Corsa", Forza:"Forza", Brick:"Brick", Altro:"Altro"};
  const PRESCR_DISC = {"Nuoto":"Nuoto","Ciclismo":"Ciclismo","Corsa a piedi":"Corsa","Forza":"Forza"};

  let sess = null, atleta = null, errore = "", stato = "non connesso";
  const shadow = { sessions:{}, tests:{}, body:{}, note:"", cal:"", versione:null, soglie:{}, profilo:"" };
  const attivo = () => !!(sess && atleta);
  const oggi = () => todayISO();
  const nz = (v) => (v === "" || v === undefined || Number.isNaN(v)) ? null : v;
  const num = (v) => (v === null || v === undefined || v === "") ? null : +v;
  const inRange = (v, lo, hi) => { const n = num(v); return n === null ? null : Math.min(hi, Math.max(lo, Math.round(n))); };

  /* ---------- autenticazione (GoTrue via REST) ---------- */
  async function authPost(path, body){
    const r = await fetch(`${REST.url}/auth/v1/${path}`, {method:"POST", headers:{apikey:REST.key, "Content-Type":"application/json"}, body:JSON.stringify(body)});
    const j = await r.json().catch(()=>({}));
    if (!r.ok) throw new Error(j.error_description || j.msg || j.message || j.error || `errore ${r.status}`);
    return j;
  }
  function setSess(j){
    sess = { access_token:j.access_token, refresh_token:j.refresh_token,
      expires_at: Math.floor(Date.now()/1000) + (j.expires_in || 3600), user:{id:j.user.id, email:j.user.email} };
    try{ localStorage.setItem(SESS_LS, JSON.stringify(sess)); }catch(e){}
  }
  async function token(){
    if (!sess) throw new Error("non connesso");
    if (sess.expires_at - Date.now()/1000 < 60){
      try{ setSess(await authPost("token?grant_type=refresh_token", {refresh_token:sess.refresh_token})); }
      catch(e){ await logout(); throw new Error("sessione scaduta, accedi di nuovo"); }
    }
    return sess.access_token;
  }
  async function login(email, password){
    errore = ""; setSess(await authPost("token?grant_type=password", {email, password}));
    await dopoLogin();
  }
  async function registra(email, password){
    errore = "";
    const j = await authPost("signup", {email, password});
    if (j.access_token){ setSess(j); await dopoLogin(); return "accesso effettuato"; }
    return "registrazione ricevuta: conferma l'indirizzo dalla mail che ti è arrivata, poi accedi";
  }
  async function logout(){
    sess = null; atleta = null; stato = "non connesso";
    try{ localStorage.removeItem(SESS_LS); }catch(e){}
    setSave("off", "non connesso · salvato su questo browser");
  }

  /* ---------- REST con il token dell'utente ---------- */
  async function q(method, path, body, prefer){
    const t = await token();
    const headers = {apikey:REST.key, Authorization:`Bearer ${t}`, "Content-Type":"application/json"};
    if (prefer) headers.Prefer = prefer; else if (method !== "GET") headers.Prefer = "return=representation";
    const r = await fetch(`${REST.url}/rest/v1/${path}`, {method, headers, body: body === undefined ? undefined : JSON.stringify(body)});
    if (!r.ok){ const txt = await r.text().catch(()=>""); throw new Error(`${method} ${path.split("?")[0]}: ${r.status} ${txt.slice(0,160)}`); }
    if (r.status === 204) return null;
    const ct = r.headers.get("content-type") || "";
    return ct.includes("json") ? r.json() : null;
  }

  /* ---------- mappature S <-> tabelle ---------- */
  const aSeduta = (s) => ({ id:s.id, atleta_id:atleta.id, data:s.date, disciplina:DISC_DB[s.disc] || "Altro",
    tipo: nz(s.tipo) || (s.disc === "Riposo" ? "Riposo" : s.disc === "Bodyweight" ? "Bodyweight" : null),
    durata_min: Math.max(0, Math.round(+s.min || 0)),
    distanza_m: num(s.dist) === null ? null : (s.disc === "Nuoto" ? num(s.dist) : num(s.dist) * 1000),
    passo_s: num(s.pace), potenza_w: num(s.np), potenza_media_w: num(s.pw), fc_media: inRange(s.hrAvg, 0, 300), fc_max: inRange(s.hrMax, 0, 300),
    rpe: inRange(s.rpe, 0, 10), carico: sessionTSS(s), carico_dichiarato: s.tssOverride !== null && s.tssOverride !== undefined && s.tssOverride !== "",
    fonte: s.fonte || "atleta", esterno_fonte: s.esterno_fonte || null, esterno_id: s.esterno_id || null, prescritta_id: s.prescritta_id || null,
    sensazione: nz(s.feel) || null, note: nz(s.note) || null });
  const daSeduta = (r) => ({ id:r.id, date:r.data, disc: DISC_DA_DB[r.disciplina] || "Altro", tipo:r.tipo || "",
    min:r.durata_min, dist: r.distanza_m === null ? null : (r.disciplina === "Nuoto" ? +r.distanza_m : +r.distanza_m / 1000),
    pace: num(r.passo_s), np: num(r.potenza_w), pw: num(r.potenza_media_w), hrAvg: r.fc_media, hrMax: r.fc_max, rpe: r.rpe,
    tssOverride: r.carico_dichiarato ? +r.carico : null, feel: r.sensazione || "", note: r.note || "",
    fonte: r.fonte || "atleta", esterno_fonte: r.esterno_fonte || null, esterno_id: r.esterno_id || null, prescritta_id: r.prescritta_id || null });
  const discTest = (tipo) => /bici/i.test(tipo) ? "Ciclismo" : /corsa/i.test(tipo) ? "Corsa" : /nuoto/i.test(tipo) ? "Nuoto" : "Generale";
  const aTest = (t) => ({ id:t.id, atleta_id:atleta.id, data:t.date, disciplina:discTest(t.tipo || ""), protocollo:t.tipo || "Altro",
    risultato:{ val:num(t.val), unit:t.unit || null, hrAvg:num(t.hrAvg), hrMax:num(t.hrMax) }, note: nz(t.note) || null });
  const daTest = (r) => ({ id:r.id, date:r.data, tipo:r.protocollo, val:(r.risultato||{}).val ?? null, unit:(r.risultato||{}).unit || "",
    hrAvg:(r.risultato||{}).hrAvg ?? null, hrMax:(r.risultato||{}).hrMax ?? null, note:r.note || "" });
  const aBen = (d, b) => ({ atleta_id:atleta.id, data:d, sonno:inRange(b.qSonno,1,7), fatica:inRange(b.fatica,1,7), stress:inRange(b.stress,1,7),
    peso:num(b.peso), fc_riposo:inRange(b.fcRip,0,250), hrv:inRange(b.hrv,0,500), sonno_ore:num(b.sonno), motivazione:inRange(b.motiv,1,7), note: nz(b.note) || null });
  const daBen = (r) => ({ qSonno:r.sonno, fatica:r.fatica, stress:r.stress, peso:num(r.peso), fcRip:r.fc_riposo, hrv:r.hrv, sonno:num(r.sonno_ore), motiv:r.motivazione, note:r.note || "" });
  const profilo = () => ({ hrMax:S.setup.hrMax, hrRest:S.setup.hrRest, peso:S.setup.peso });
  const parametri = () => Object.fromEntries(PLAN_KEYS.map(k => [k, S.setup[k]]));

  /* ---------- intervals.icu (terzo scrittore: dispositivo) ---------- */
  let intervals = null;   // {athlete_id, ultimo_import, ultimo_esito} — la chiave non si rilegge
  let importInCorso = false;
  async function caricaIntervals(){
    const r = await q("GET", `collegamento_intervals?select=athlete_id,ultimo_import,ultimo_esito&atleta_id=eq.${atleta.id}`);
    intervals = r[0] || null;
  }
  async function salvaIntervals(athleteId, apiKey){
    const riga = {atleta_id:atleta.id, athlete_id:(athleteId || "0").trim(), aggiornato_il:new Date().toISOString()};
    if (apiKey) riga.api_key = apiKey.trim();
    if (!intervals && !apiKey) throw new Error("serve la chiave API di intervals.icu");
    await q("POST", "collegamento_intervals?on_conflict=atleta_id", [riga], "resolution=merge-duplicates,return=minimal");
    await caricaIntervals();
  }
  async function importaIntervals(opts){
    if (importInCorso) return null;
    importInCorso = true;
    try{
      const t = await token();
      const r = await fetch(`${REST.url}/functions/v1/intervals-import`, {method:"POST",
        headers:{apikey:REST.key, Authorization:`Bearer ${t}`, "Content-Type":"application/json"}, body: JSON.stringify(opts || {})});
      const j = await r.json().catch(()=>({}));
      if (!r.ok) throw new Error(j.errore ? `${j.errore}${j.dettaglio ? " — " + j.dettaglio : ""}` : `errore ${r.status}`);
      // rilegge le sedute: quelle importate arrivano con fonte = dispositivo
      const se = await q("GET", `seduta_eseguita?select=*&atleta_id=eq.${atleta.id}&order=data.desc&limit=5000`);
      S.sessions = se.map(daSeduta); shadow.sessions = Object.fromEntries(S.sessions.map(s => [s.id, JSON.stringify(s)]));
      await caricaIntervals();
      try{ localStorage.setItem(LS, JSON.stringify(S)); }catch(e){}
      return j;
    } finally { importInCorso = false; }
  }
  const scaduto = (iso, ore) => !iso || (Date.now() - new Date(iso).getTime()) > ore * 3600000;

  /* ---------- caricamento al login ---------- */
  async function dopoLogin(){
    const locale = JSON.parse(JSON.stringify({sessions:S.sessions, tests:S.tests, body:S.body, note:S.note, cal:S.cal}));
    const uuid = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/i;
    [...locale.sessions, ...locale.tests].forEach(x => { if (!uuid.test(String(x.id))) x.id = uid(); });
    await carica();
    // prima volta con dati già nel browser: li si porta nel database
    const daPortare = [];
    if (!S.sessions.length && locale.sessions.length){ S.sessions = locale.sessions; daPortare.push("sessions"); }
    if (!S.tests.length && locale.tests.length){ S.tests = locale.tests; daPortare.push("tests"); }
    if (!Object.keys(S.body).length && Object.keys(locale.body).length){ S.body = locale.body; daPortare.push("body"); }
    if (!Object.keys(S.note).length && Object.keys(locale.note).length) { S.note = locale.note; daPortare.push("config"); }
    if (!Object.keys(S.cal).length && Object.keys(locale.cal).length) { S.cal = locale.cal; daPortare.push("calendar"); }
    if (!shadow.versione) daPortare.push("config");
    stato = "connesso"; PLAN_CACHE.key = null; render();
    if (daPortare.length) daPortare.forEach(persist); else setSave("", `sincronizzato · ${sess.user.email}`);
    // import automatico da intervals.icu se l'ultimo risale a più di 6 ore fa
    if (intervals && scaduto(intervals.ultimo_import, 6)){
      try{ await importaIntervals(); render(); }catch(e){ console.warn("intervals:", e.message); }
    }
  }
  async function carica(){
    let rows = await q("GET", `atleta?select=id,nome,profilo&user_id=eq.${sess.user.id}`);
    if (!rows.length) rows = await q("POST", "atleta", [{user_id:sess.user.id, nome:S.setup.atleta || "Atleta", profilo:profilo()}]);
    atleta = rows[0]; const A = atleta.id;
    if (atleta.nome) S.setup.atleta = atleta.nome;
    if (atleta.profilo) for (const k of PROFILO_KEYS) if (atleta.profilo[k] != null) S.setup[k] = atleta.profilo[k];
    shadow.profilo = JSON.stringify(profilo()) + atleta.nome;
    const ver = await q("GET", `piano_versione?select=id,numero,parametri,obiettivo_id&atleta_id=eq.${A}&order=numero.desc&limit=1`);
    shadow.versione = ver[0] || null;
    if (ver[0] && ver[0].parametri) for (const k of PLAN_KEYS) if (ver[0].parametri[k] !== undefined) S.setup[k] = ver[0].parametri[k];
    const sg = await q("GET", `soglia?select=disciplina,tipo,unita,valore&atleta_id=eq.${A}&order=creato_il.desc`);
    shadow.soglie = {};
    for (const r of sg){ const k = Object.keys(SOGLIE).find(k => SOGLIE[k].join("|") === `${r.disciplina}|${r.tipo}|${r.unita}`);
      if (k && !(k in shadow.soglie)){ shadow.soglie[k] = +r.valore; S.setup[k] = +r.valore; } }
    const se = await q("GET", `seduta_eseguita?select=*&atleta_id=eq.${A}&order=data.desc&limit=5000`);
    S.sessions = se.map(daSeduta); shadow.sessions = Object.fromEntries(S.sessions.map(s => [s.id, JSON.stringify(s)]));
    const te = await q("GET", `test?select=*&atleta_id=eq.${A}&order=data.desc`);
    S.tests = te.map(daTest); shadow.tests = Object.fromEntries(S.tests.map(t => [t.id, JSON.stringify(t)]));
    const be = await q("GET", `benessere?select=*&atleta_id=eq.${A}`);
    S.body = {}; for (const r of be) S.body[r.data] = daBen(r);
    shadow.body = Object.fromEntries(Object.entries(S.body).map(([d,b]) => [d, JSON.stringify(b)]));
    const an = await q("GET", `annotazione?select=chiave,valore&atleta_id=eq.${A}`);
    S.note = {}; S.cal = {};
    for (const r of an){ if (r.chiave === "note") S.note = r.valore || {}; if (r.chiave === "cal") S.cal = r.valore || {}; }
    shadow.note = JSON.stringify(S.note); shadow.cal = JSON.stringify(S.cal);
    await caricaIntervals();
  }

  /* ---------- sincronizzazione per differenza ---------- */
  async function syncLista(nome, tabella, lista, verso){
    const sh = shadow[nome], visti = new Set();
    for (const x of lista){
      visti.add(x.id); const j = JSON.stringify(x);
      if (!(x.id in sh)) await q("POST", tabella, [verso(x)]);
      else if (sh[x.id] !== j){ const r = verso(x); delete r.id; delete r.atleta_id; await q("PATCH", `${tabella}?id=eq.${x.id}`, r, "return=minimal"); }
      sh[x.id] = j;
    }
    for (const id of Object.keys(sh)) if (!visti.has(id)){ await q("DELETE", `${tabella}?id=eq.${id}`, undefined, "return=minimal"); delete sh[id]; }
  }
  const SYNC = {
    sessions: () => syncLista("sessions", "seduta_eseguita", S.sessions, aSeduta),
    tests: () => syncLista("tests", "test", S.tests, aTest),
    body: async () => {
      for (const [d, b] of Object.entries(S.body)){
        const j = JSON.stringify(b); if (shadow.body[d] === j) continue;
        await q("POST", "benessere?on_conflict=atleta_id,data", [aBen(d, b)], "resolution=merge-duplicates,return=minimal");
        shadow.body[d] = j;
      }
    },
    calendar: async () => {
      const j = JSON.stringify(S.cal); if (j === shadow.cal) return;
      await q("POST", "annotazione?on_conflict=atleta_id,chiave", [{atleta_id:atleta.id, chiave:"cal", valore:S.cal, aggiornata_il:new Date().toISOString()}], "resolution=merge-duplicates,return=minimal");
      shadow.cal = j;
    },
    config: async () => {
      const jn = JSON.stringify(S.note);
      if (jn !== shadow.note){
        await q("POST", "annotazione?on_conflict=atleta_id,chiave", [{atleta_id:atleta.id, chiave:"note", valore:S.note, aggiornata_il:new Date().toISOString()}], "resolution=merge-duplicates,return=minimal");
        shadow.note = jn;
      }
      const jp = JSON.stringify(profilo()) + S.setup.atleta;
      if (jp !== shadow.profilo){ await q("PATCH", `atleta?id=eq.${atleta.id}`, {nome:S.setup.atleta, profilo:profilo()}, "return=minimal"); shadow.profilo = jp; }
      const nuove = Object.keys(SOGLIE).filter(k => +S.setup[k] !== shadow.soglie[k] && isFinite(+S.setup[k]));
      if (nuove.length){
        await q("POST", "soglia", nuove.map(k => { const [disciplina, tipo, unita] = SOGLIE[k];
          return {atleta_id:atleta.id, disciplina, tipo, unita, valore:+S.setup[k], origine:"dichiarata", valida_da:oggi(), regola_id:"S1"}; }), "return=minimal");
        nuove.forEach(k => shadow.soglie[k] = +S.setup[k]);
      }
      const jv = JSON.stringify(parametri());
      if (!shadow.versione || JSON.stringify(shadow.versione.parametri || {}) !== jv) await nuovaVersione();
    }
  };
  /* C2: una nuova versione del piano a ogni cambio dei parametri; il prescritto lo
     scrive solo il motore (C1) e ogni versione porta la sua decisione (C5). */
  async function nuovaVersione(){
    const p = piano(); if (!p.weeks) return;
    const A = atleta.id, gradino = GRADINO_DB[S.setup.obiettivo] || "Ironman", dataGara = S.setup.raceDate;
    let ob = (await q("GET", `obiettivo?select=id,gradino,data_gara&atleta_id=eq.${A}&stato=eq.aperto&order=aperto_il.desc&limit=1`))[0];
    if (ob && (ob.gradino !== gradino || ob.data_gara !== dataGara)){
      await q("PATCH", `obiettivo?id=eq.${ob.id}`, {stato:"traslato", chiuso_il:new Date().toISOString(), motivo_chiusura:"cambio nel setup", regola_id:"L3"}, "return=minimal");
      ob = null;
    }
    if (!ob) ob = (await q("POST", "obiettivo", [{atleta_id:A, gradino, data_gara:dataGara, stato:"aperto", regola_id:"L1"}]))[0];
    const numero = (shadow.versione ? shadow.versione.numero : 0) + 1;
    const ver = (await q("POST", "piano_versione", [{atleta_id:A, obiettivo_id:ob.id, numero, valida_da:oggi(),
      regola_innesco: numero === 1 ? "G1" : "R1", esito: numero === 1 ? "prima_generazione" : "modificato", parametri:parametri()}]))[0];
    const zona = new Map(); (LIB.varianti || []).forEach(v => zona.set(v.cod, v.zona)); (LIB.workouts || []).forEach(w => zona.set(w.cod, w.zona));
    const righe = [];
    for (const w of p.weeks) for (const s of w.sed) righe.push({ versione_id:ver.id, data:addDays(w.from, DAYS.indexOf(s.giorno)), settimana:w.w, fase:w.fase || null,
      disciplina: s.cod === "BRICK" ? "Brick" : (PRESCR_DISC[s.disc] || "Corsa"), stimolo:s.ob, zona: s.cod === "BRICK" ? "Z3" : (zona.get(s.cod) || null),
      durata_min: Math.max(1, Math.round(s.tempo)), carico_previsto: Math.round(s.rtss * 10) / 10, variante_cod: s.cod, costo: s.costo || null, stato:"prevista", regola_id:"G1" });
    for (let i = 0; i < righe.length; i += 500) await q("POST", "seduta_prescritta", righe.slice(i, i + 500), "return=minimal");
    await q("POST", "decisione", [{atleta_id:A, versione_id:ver.id, data:oggi(), tipo:"generazione", regola_id:"I8",
      dettaglio:{arrivo:p.scala.arrivo, vincolo:p.scala.vincolo, intro:p.scala.intro, non_assorbite:p.scala.non_assorbite,
        blocchi:p.scala.blocchi.map(b => ({gradino:b.gradino, settimane:b.settimane, picco:b.picco})), sedute:righe.length}}], "return=minimal");
    shadow.versione = {id:ver.id, numero, parametri:parametri(), obiettivo_id:ob.id};
  }
  const pend = new Set(); let timer = null;
  function persist(part){
    pend.add(part); setSave("pending", "salvataggio…"); clearTimeout(timer); timer = setTimeout(flush, 800);
  }
  async function flush(){
    const parts = [...pend]; pend.clear();
    try{ for (const p of parts) if (SYNC[p]) await SYNC[p](); errore = ""; setSave("", `sincronizzato · ${sess.user.email}`); }
    catch(e){ errore = e.message; setSave("off", "errore di salvataggio"); console.error(e); }
  }

  /* ---------- avvio ---------- */
  async function avvia(){
    try{ const raw = localStorage.getItem(SESS_LS); if (raw) sess = JSON.parse(raw); }catch(e){}
    if (!sess){ setSave("off", "non connesso · salvato su questo browser"); return; }
    try{ await dopoLogin(); }
    catch(e){ errore = e.message; stato = "errore"; setSave("off", "non connesso · salvato su questo browser"); render(); }
  }
  return { attivo, avvia, login, registra, logout, persist, flush,
    intervals: () => intervals, salvaIntervals, importaIntervals, importInCorso: () => importInCorso,
    email: () => sess && sess.user.email, stato: () => stato, errore: () => errore,
    versione: () => shadow.versione };
})();
</script>
<script>
"use strict";
/* ===================== grafici ===================== */
const TIP = () => document.getElementById("tip");
function showTip(ev, html){ const t = TIP(); t.innerHTML = html; t.classList.add("on");
  const r = t.getBoundingClientRect();
  let x = ev.clientX+14, y = ev.clientY-10;
  if (x+r.width > innerWidth-8) x = ev.clientX-r.width-14;
  if (y+r.height > innerHeight-8) y = innerHeight-r.height-8;
  t.style.left = x+"px"; t.style.top = Math.max(8,y)+"px"; }
function hideTip(){ TIP().classList.remove("on"); }
const svgNS = "http://www.w3.org/2000/svg";
function mk(tag, attrs, parent){ const e = document.createElementNS(svgNS, tag);
  for (const k in attrs) e.setAttribute(k, attrs[k]); if (parent) parent.appendChild(e); return e; }
const NICE = [1,1.5,2,2.5,3,4,5,6,7.5,10];
function niceStep(raw){ const mag = Math.pow(10, Math.floor(Math.log10(Math.max(raw,1e-9))));
  return (NICE.find(x => x*mag >= raw) || 10) * mag; }
function niceAxis(lo, hi, ticks){
  const step = niceStep(Math.max(hi-lo, 1e-6)/ticks);
  const min = Math.floor(lo/step)*step;
  const n = Math.max(1, Math.ceil((hi-min)/step));
  return {min, max:min+step*n, n, fmt:v=>step<1?n1(v):String(Math.round(v))};
}

const PERIOD_COLOR = {"Fra due stagioni":"var(--line-2)","Introduzione":"var(--plan)","Transizione":"var(--plan)",
  "Preparation":"var(--plan)","Base 1":"var(--s1)","Base 2":"var(--s1)","Build 1":"var(--s2)","Build 2":"var(--s2)",
  "Specific":"var(--s2)","Peak":"var(--s4)","Taper":"var(--s5)"};

/* barre settimanali: pianificato (riferimento) vs registrato */
function chartWeekly(host, {label, plan, act, unit, fmt}){
  const W=1000, H=250, L=42, R=8, T=12, B=54, iw=W-L-R, ih=H-T-B;
  const ax = niceAxis(0, Math.max(...plan, ...act, 1)*1.06, 4), max = ax.max;
  const bw = iw/NW(), bar = Math.min(9, bw*0.34);
  const svg = mk("svg", {viewBox:`0 0 ${W} ${H}`, class:"chart", role:"img",
    "aria-label":label+" per settimana, pianificato e registrato"});
  for (let i=0;i<=ax.n;i++){ const v = ax.min+(max-ax.min)*i/ax.n, y = T+ih-ih*i/ax.n;
    mk("line",{x1:L,x2:W-R,y1:y,y2:y,class:"axline"},svg);
    mk("text",{x:L-7,y:y+3,"text-anchor":"end"},svg).textContent = fmt(v); }
  const wks = weeks();
  wks.forEach((w,i)=>{
    const cx = L+bw*(i+.5);
    const hp = ih*plan[i]/max, ha = ih*act[i]/max;
    mk("rect",{x:cx-bar-1, y:T+ih-hp, width:bar, height:Math.max(hp,0), rx:2, fill:"var(--plan-soft)",
      stroke:"var(--plan)","stroke-width":1},svg);
    if (act[i]>0) mk("rect",{x:cx+1, y:T+ih-ha, width:bar, height:Math.max(ha,0), rx:2, fill:"var(--s1)"},svg);
    if (i%4===0 || i===NW()-1) mk("text",{x:cx, y:T+ih+14, "text-anchor":"middle"},svg).textContent = w.w;
    const hit = mk("rect",{x:L+bw*i, y:T, width:bw, height:ih, fill:"transparent"},svg);
    hit.addEventListener("mousemove", ev => showTip(ev,
      `<b>S${w.w} · ${w.periodo} · ${fmtD(w.from)}–${fmtD(w.to)}</b>
       <div class="r"><span>Pianificato</span><span>${fmt(plan[i])} ${unit}</span></div>
       <div class="r"><span>Registrato</span><span>${fmt(act[i])} ${unit}</span></div>
       <div class="r"><span>Aderenza</span><span>${plan[i]?pct(act[i]/plan[i]):"—"}</span></div>`));
    hit.addEventListener("mouseleave", hideTip);
  });
  /* fascia dei periodi */
  let i0 = 0;
  wks.forEach((w,i)=>{
    const last = i===NW()-1 || wks[i+1].periodo !== w.periodo;
    if (!last) return;
    const x = L+bw*i0, ww = bw*(i-i0+1);
    mk("rect",{x, y:T+ih+22, width:ww-2, height:7, rx:2, fill:PERIOD_COLOR[w.periodo]||"var(--plan)",
      opacity:.75},svg);
    if (ww > 52) mk("text",{x:x+ww/2, y:T+ih+43, "text-anchor":"middle"},svg).textContent = w.periodo;
    i0 = i+1;
  });
  host.appendChild(svg);
}

/* PMC: CTL / ATL / TSB */
function chartPMC(host, data){
  const W=1000, H=300, L=42, R=44, T=14, B=48, iw=W-L-R, ih=H-T-B;
  const vals = data.flatMap(d=>[d.ctl,d.atl,d.tsb]);
  const ax = niceAxis(Math.min(0, Math.min(...vals)*1.1), Math.max(...vals,10)*1.08, 5);
  const min = ax.min, max = ax.max;
  const y = v => T+ih - ih*(v-min)/(max-min);
  const x = i => L + iw*i/(ND()-1);
  const svg = mk("svg",{viewBox:`0 0 ${W} ${H}`, class:"chart", role:"img",
    "aria-label":"Curva di forma: CTL, ATL e TSB giorno per giorno"});
  /* banda TSB produttiva */
  mk("rect",{x:L, y:y(-10), width:iw, height:Math.max(0,y(-30)-y(-10)), fill:"var(--s3)", opacity:.07},svg);
  mk("text",{x:L+iw-8, y:y(-10)+13, fill:"var(--ink-3)", "text-anchor":"end"},svg)
    .textContent = "TSB −10…−30 · carico produttivo";
  for (let i=0;i<=ax.n;i++){ const v = min+(max-min)*i/ax.n;
    mk("line",{x1:L,x2:W-R,y1:y(v),y2:y(v),class:"axline"},svg);
    mk("text",{x:L-7,y:y(v)+3,"text-anchor":"end"},svg).textContent = Math.round(v); }
  mk("line",{x1:L,x2:W-R,y1:y(0),y2:y(0),class:"zeroline"},svg);
  /* confini di periodo + etichette mese */
  let i0=0; const wks = weeks();
  wks.forEach((w,i)=>{ const last = i===NW()-1 || wks[i+1].periodo !== w.periodo; if(!last) return;
    const xe = x((i+1)*7-1); if (i<NW()-1) mk("line",{x1:xe,x2:xe,y1:T,y2:T+ih,stroke:"var(--line)",
      "stroke-dasharray":"2 3"},svg);
    const xm = (x(i0*7)+xe)/2;
    if (xe-x(i0*7) > 52) mk("text",{x:xm, y:T+ih+30, "text-anchor":"middle"},svg).textContent = w.periodo;
    mk("rect",{x:x(i0*7), y:T+ih+10, width:xe-x(i0*7)-2, height:7, rx:2,
      fill:PERIOD_COLOR[w.periodo]||"var(--plan)", opacity:.75},svg);
    i0 = i+1; });
  const line = (key, color, wdt) => {
    let d = ""; data.forEach((p,i)=>{ d += (i?"L":"M")+x(i).toFixed(1)+" "+y(p[key]).toFixed(1); });
    mk("path",{d, fill:"none", stroke:color, "stroke-width":wdt, "stroke-linejoin":"round"},svg); };
  line("tsb","var(--s3)",1.6); line("atl","var(--s2)",2); line("ctl","var(--s1)",2.4);
  /* oggi + gara */
  const ti = diffDays(startDate(), todayISO());
  if (ti>=0 && ti<=ND()-1){ mk("line",{x1:x(ti),x2:x(ti),y1:T,y2:T+ih,stroke:"var(--ink-3)",
      "stroke-dasharray":"3 3"},svg);
    mk("text",{x:x(ti)+5,y:T+10,fill:"var(--ink-2)"},svg).textContent = "oggi"; }
  mk("line",{x1:x(ND()-1),x2:x(ND()-1),y1:T,y2:T+ih,stroke:"var(--crit)","stroke-width":1.5},svg);
  mk("text",{x:x(ND()-1)+5,y:T+10,fill:"var(--crit)"},svg).textContent = "gara";
  /* etichette finali */
  const lastP = data[data.length-1];
  const labs = [["ctl","CTL","var(--s1)"],["atl","ATL","var(--s2)"],["tsb","TSB","var(--s3)"]]
    .map(([k,lab,c])=>({lab,c,y:y(lastP[k])})).sort((a,b)=>a.y-b.y);
  for (let i=1;i<labs.length;i++) if (labs[i].y-labs[i-1].y < 11) labs[i].y = labs[i-1].y+11;
  labs.forEach(o=> mk("text",{x:W-R+5, y:o.y+3, fill:o.c, "font-weight":600},svg).textContent = o.lab);
  /* crosshair */
  const cross = mk("line",{x1:0,x2:0,y1:T,y2:T+ih,stroke:"var(--ink-3)","stroke-width":1,opacity:0},svg);
  const dot = mk("circle",{r:3.5,fill:"var(--s1)",stroke:"var(--surface)","stroke-width":2,opacity:0},svg);
  const hit = mk("rect",{x:L,y:T,width:iw,height:ih,fill:"transparent"},svg);
  hit.addEventListener("mousemove", ev=>{
    const box = svg.getBoundingClientRect();
    const rel = (ev.clientX-box.left)/box.width*W;
    const i = Math.max(0, Math.min(ND()-1, Math.round((rel-L)/iw*(ND()-1))));
    const p = data[i];
    cross.setAttribute("x1",x(i)); cross.setAttribute("x2",x(i)); cross.setAttribute("opacity",1);
    dot.setAttribute("cx",x(i)); dot.setAttribute("cy",y(p.ctl)); dot.setAttribute("opacity",1);
    showTip(ev, `<b>${fmtFull(p.date)} · S${p.week}</b>
      <div class="r"><span>TSS del giorno</span><span>${p.tss||0}</span></div>
      <div class="r"><span>CTL fitness</span><span>${n1(p.ctl)}</span></div>
      <div class="r"><span>ATL fatica</span><span>${n1(p.atl)}</span></div>
      <div class="r"><span>TSB forma</span><span>${n1(p.tsb)}</span></div>`);
  });
  hit.addEventListener("mouseleave", ()=>{ hideTip(); cross.setAttribute("opacity",0); dot.setAttribute("opacity",0); });
  host.appendChild(svg);
}

/* barre orizzontali per disciplina, con etichette dirette */
function chartDisc(host, rows){
  const W=1000, rowH=42, L=132, R=100, H=rows.length*rowH+24;
  const max = Math.max(...rows.map(r=>Math.max(r.plan,r.act)),1);
  const svg = mk("svg",{viewBox:`0 0 ${W} ${H}`, class:"chart", role:"img",
    "aria-label":"Ore per disciplina, pianificate e registrate"});
  rows.forEach((r,i)=>{
    const yb = 12+i*rowH;
    mk("text",{x:L-12, y:yb+16, "text-anchor":"end", fill:"var(--ink)", style:"font-size:11.5px"},svg).textContent = r.name;
    const wp = (W-L-R)*r.plan/max, wa = (W-L-R)*r.act/max;
    mk("rect",{x:L, y:yb+2, width:Math.max(wp,1), height:11, rx:3, fill:"var(--plan-soft)",
      stroke:"var(--plan)","stroke-width":1},svg);
    mk("rect",{x:L, y:yb+17, width:Math.max(wa,1), height:11, rx:3, fill:r.color},svg);
    mk("text",{x:L+Math.max(wp,1)+8, y:yb+11.5, fill:"var(--ink-3)"},svg).textContent = n1(r.plan)+" h pian.";
    mk("text",{x:L+Math.max(wa,1)+8, y:yb+26.5, fill:"var(--ink-2)", "font-weight":600},svg)
      .textContent = n1(r.act)+" h reg.";
  });
  host.appendChild(svg);
}
function legend(items){ return `<div class="legend">${items.map(i=>
  `<span class="k ${i.line?"line":""}"><i style="background:${i.c}${i.outline?";border:1px solid var(--plan)":""}"></i>${esc(i.t)}</span>`).join("")}</div>`; }
</script>
<script>

const vuoto = (msg) => `<div class="panel"><div class="empty">${msg}</div></div>`;

/* ---------------------------------------------------- DASHBOARD */
function vDashboard(){

    <div class="stat"><div class="lab">Ore registrate</div>
      <div class="val">${n1(actH)}<small> / ${n1(planH)} h</small></div>
      <div class="sub">${doneWeeks.length ? `<span class="pill ${complianceClass(rate)}">${pct(rate)} di quanto previsto finora</span>` : "il piano non è ancora iniziato"}</div></div>
    <div class="stat"><div class="lab">CTL — fitness</div><div class="val">${n1(now.ctl)}</div>
      <div class="sub">al via ${n1(pm[last].ctl)} · ${nf(actT)} / ${nf(planT)} TSS</div></div>
    <div class="stat"><div class="lab">TSB — forma</div><div class="val">${n1(now.tsb)}</div>
      <div class="sub">${now.tsb > 5 ? "fresco" : now.tsb > -10 ? "in equilibrio" : now.tsb > -30 ? "carico produttivo" : "fatica alta"}</div></div>
  </div>

  <div class="panel"><header><h2>Ore per settimana</h2>
    <span class="note">pianificato dal motore vs registrato, con le fasi del blocco</span></header>
    <div class="body">${legend([{c:"var(--plan-soft)",t:"Pianificato",outline:1},{c:"var(--s1)",t:"Registrato"}])}
      <div id="cW"></div></div></div>

  <div class="panel"><header><h2>Carico per settimana (rTSS)</h2>
    <span class="note">il carico pianificato è la somma del rTSS delle sedute pescate dalla libreria</span></header>
    <div class="body">${legend([{c:"var(--plan-soft)",t:"Pianificato",outline:1},{c:"var(--s1)",t:"Registrato"}])}
      <div id="cT"></div></div></div>

  <div class="grid g2">
    <div class="panel"><header><h2>Volume per disciplina</h2></header>
      <div class="body">${legend([{c:"var(--plan-soft)",t:"Pianificato",outline:1},{c:"var(--ink-3)",t:"Registrato (colore della disciplina)"}])}
        <div id="cD"></div></div></div>
    <div class="panel"><header><h2>Riepilogo per blocco</h2></header>
      <div class="tw"><table><thead><tr><th>Blocco</th><th class="num">Sett.</th>
        <th class="num">Ore pian.</th><th class="num">Ore reg.</th><th class="num">rTSS pian.</th>
        <th class="num">TSS reg.</th><th class="num">Aderenza</th></tr></thead><tbody>
        ${[["attesa","Fra due stagioni"],["intro","Introduzione"],...p.blocchi.map((b,i)=>["b"+i, b.A.gara]),["transizione","Transizioni"]].map(([key,lab])=>{
          const ws = wks.filter(w => key.startsWith("b") && key!=="blocco" ? (w.seg==="blocco" && w.bi===+key.slice(1)) : w.seg===key); if(!ws.length) return "";
          const ph = ws.reduce((s,w)=>s+w.hours,0), pt = ws.reduce((s,w)=>s+w.tssPlan,0);
          const ah = ws.reduce((s,w)=>s+((wa[w.w]||{min:0}).min)/60,0);
          const at = ws.reduce((s,w)=>s+((wa[w.w]||{tss:0}).tss),0);
          return `<tr><td>${esc(lab)}</td>
            <td class="num dim">${ws.length}</td><td class="num">${n1(ph)}</td><td class="num">${n1(ah)}</td>
            <td class="num">${pt}</td><td class="num">${Math.round(at)}</td>
